<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tour Manager — Secreto La Fortuna Tours</title>
<style>
:root{--nav:#102a43;--accent:#0f766e;--bg:#f4f6f8;--card:#fff;--line:#e5e7eb;--muted:#64748b;--danger:#b91c1c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#17202a;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:var(--nav);color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:20px;margin:0 0 3px}header small{opacity:.8}
nav{background:#fff;border-bottom:1px solid var(--line);padding:11px 16px;display:flex;gap:7px;overflow:auto}
nav button{border:0;background:#eef2f7;border-radius:8px;padding:9px 13px;white-space:nowrap;cursor:pointer}
nav button.active{background:var(--accent);color:#fff}
main{max-width:1450px;margin:auto;padding:20px}.view{display:none}.view.active{display:block}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
button{font:inherit;cursor:pointer}.primary{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 14px}.secondary{background:#fff;color:#17202a;border:1px solid #cbd5e1;border-radius:8px;padding:9px 13px}.danger{background:var(--danger);color:#fff;border:0;border-radius:8px;padding:9px 13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:17px;margin-bottom:14px}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:13px}.metric{font-size:27px;font-weight:700;margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.full{grid-column:1/-1}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:7px;background:#fff}.field textarea{min-height:75px}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.filters{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.filters .field{min-width:180px}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line)}th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}th{background:#f8fafc}
.badge{display:inline-block;border-radius:999px;padding:4px 8px;background:#ecfdf5;color:#047857;font-size:12px}.pending{background:#fff7ed;color:#c2410c}.empty{text-align:center;padding:28px;color:var(--muted)}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modal.open{display:flex}.modalbox{background:#fff;border-radius:14px;max-width:1000px;width:100%;max-height:94vh;overflow:auto;padding:22px}
.preview{background:#f8fafc;padding:15px;border-radius:9px}.document{background:#fff;border:1px solid #ddd;padding:25px;max-width:720px;margin:auto}.center{text-align:center}.meta{line-height:1.6}.total{font-size:21px;font-weight:700;margin-top:10px}
.notice{background:#fff7ed;border:1px solid #fed7aa;padding:10px;border-radius:8px;color:#9a3412;margin-bottom:12px}
.report-tabs{display:flex;gap:8px;flex-wrap:wrap}.report{display:none}.report.active{display:block}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.cards,.grid{grid-template-columns:1fr}.full{grid-column:auto}}
@media print{@page{size:80mm auto;margin:0}html,body{width:80mm;background:#fff}body>*{display:none!important}#printArea{display:block!important;width:80mm}.ticket{width:76mm;margin:auto;padding:4mm 0;font-family:monospace;font-size:13px;line-height:1.45}.ticket .center{text-align:center}.ticket hr{border:0;border-top:1px dashed #000;margin:7px 0}.ticket table{border:0}.ticket td{border:0;padding:2px}.right{text-align:right}.ticket b{font-weight:700}}
</style>
</head>
<body><div id="tm-auth-screen" style="display:none;position:fixed;inset:0;background:#f4f6f8;z-index:9999;align-items:center;justify-content:center;padding:20px">
  <div style="background:#fff;border:1px solid #ddd;border-radius:14px;padding:28px;width:min(430px,100%);box-shadow:0 10px 30px #0001">
    <h2 id="tm-auth-title" style="margin-top:0">Tour Manager</h2>
    <p id="tm-auth-text" style="color:#64748b">Inicia sesión para continuar.</p>
    <form id="tm-auth-form">
      <div id="tm-auth-name-wrap" style="display:none;margin-bottom:12px"><label>Nombre<input id="tm-auth-name" style="width:100%;padding:10px;margin-top:5px" autocomplete="name"></label></div>
      <div style="margin-bottom:12px"><label>Correo<input id="tm-auth-email" type="email" required style="width:100%;padding:10px;margin-top:5px" autocomplete="username"></label></div>
      <div style="margin-bottom:12px"><label>Contraseña<input id="tm-auth-password" type="password" required style="width:100%;padding:10px;margin-top:5px" autocomplete="current-password"></label></div>
      <button type="submit" class="primary" style="width:100%" id="tm-auth-submit">Entrar</button>
      <div id="tm-auth-msg" style="margin-top:10px;color:#b91c1c"></div>
    </form>
  </div>
</div>

<header><div><h1>Secreto La Fortuna Tours</h1><small>3-101-754390 S.A. · +506 2479-7047 · secretolafortunatours@gmail.com</small></div><div>Tour Manager</div></header>
<nav id="nav"></nav>
<main id="app"></main>
<div id="modal" class="modal"><div class="modalbox" id="modalBox"></div></div>
<div id="printArea" style="display:none"></div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
'use strict';
const KEY='SLF_TOUR_MANAGER_V20', TAX=.13;
const COMPANY={commercial:'Secreto La Fortuna Tours',legal:'3-101-754390 S.A.',id:'3-101-754390',phone:'+506 2479-7047',email:'secretolafortunatours@gmail.com',address:'La Fortuna, en Hotel Secreto La Fortuna'};
const BASE_VIEWS=[['dashboard','Dashboard'],['orders','Órdenes de compra'],['payments','Pagos'],['sales','Ventas'],['reports','Reportes'],['clients','Clientes'],['tours','Tours'],['suppliers','Proveedores'],['sellers','Vendedores']];
let VIEWS=BASE_VIEWS.slice();
let TM_AUTH=null;
function tmCan(p){ return TM_AUTH && (TM_AUTH.user.role==='admin' || TM_AUTH.permissions.includes(p)); }
const EMPTY={clients:[],tours:[],suppliers:[],sellers:[],orders:[],sales:[],payments:[],seq:{OP:0,OC:0,V:0,P:0}};
let db=structuredClone(EMPTY),view='dashboard', appReady=false;

async function loadDB(){const r=await fetch('/api/state');if(!r.ok)throw new Error('No se pudo cargar la base de datos');return await r.json()}
async function saveDB(){const r=await fetch('/api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(db)});if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error||'No se pudo guardar');}render()}
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()}
function next(type){db.seq[type]=(db.seq[type]||0)+1;return type+'-'+String(db.seq[type]).padStart(6,'0')}
function $(id){return document.getElementById(id)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function money(v){return '$'+Number(v||0).toFixed(2)}
function calc(base,applyTax=true){base=Number(base||0);const tax=applyTax?base*TAX:0;return{subtotal:base,tax,total:base+tax}}
function supplier(id){return db.suppliers.find(x=>x.id===id)?.name||''}
function seller(id){return db.sellers.find(x=>x.id===id)?.name||''}
function closeModal(){$('modal').classList.remove('open')}
function modal(title,body){$('modalBox').innerHTML='<h2>'+title+'</h2>'+body;$('modal').classList.add('open')}
function preview(title,body,printAction){modal(title,`<div class="preview">${body}</div><div class="actions"><button class="secondary" onclick="closeModal()">Cerrar</button><button class="primary" onclick="${printAction}">Imprimir / Guardar PDF</button></div>`)}
function printRaw(content){$('printArea').innerHTML=content;$('printArea').style.display='block';window.print();$('printArea').style.display='none';$('printArea').innerHTML=''}

function render(){
 $('nav').innerHTML=VIEWS.map(v=>`<button class="${view===v[0]?'active':''}" onclick="go('${v[0]}')">${v[1]}</button>`).join('') + (tmCan('users.view') ? `<button onclick="go('users')" class="${view==='users'?'active':''}">Usuarios</button>` : '') + `<button onclick="tmLogout()" style="margin-left:auto">Salir (${TM_AUTH?.user?.name||''})</button>`;
 $('app').innerHTML=view==='users'?'':view==='dashboard'?dashboard():view==='orders'?orders():view==='payments'?payments():view==='sales'?sales():view==='reports'?reports():view==='clients'?clients():view==='tours'?tours():view==='suppliers'?suppliers():sellers();
 if(view==='users'){ $('app').innerHTML=''; window.TourManagerUsers?.show(); } else { window.TourManagerUsers?.hide(); }
 if(view==='payments')renderPayments();
 if(view==='reports')renderReports();
}
function go(v){view=v;render()}

function dashboard(){
 const rev=db.sales.reduce((a,x)=>a+(x.subtotal-x.discountAmount),0),cost=db.orders.reduce((a,x)=>a+x.subtotal,0);
 return `<div class="toolbar"><h2>Dashboard</h2></div><div class="cards">
 <div class="card">Ventas sin IVA<div class="metric">${money(rev)}</div></div><div class="card">Costos sin IVA<div class="metric">${money(cost)}</div></div>
 <div class="card">Margen<div class="metric">${money(rev-cost)}</div></div><div class="card">OCs pendientes<div class="metric">${db.orders.filter(o=>o.paymentStatus!=='Pagado').length}</div></div>
 <div class="card">Ventas<div class="metric">${db.sales.length}</div></div></div>
 <div class="card"><h3>Últimas órdenes</h3>${db.orders.length?`<table><tr><th>OC</th><th>Cliente</th><th>Tour</th><th>Servicio</th><th>Total</th></tr>${db.orders.slice().sort((a,b)=>b.number.localeCompare(a.number)).slice(0,10).map(o=>`<tr><td>${o.number}</td><td>${esc(o.customerName)}</td><td>${esc(o.tour)}</td><td>${o.serviceDate}</td><td>${money(o.total)}</td></tr>`).join('')}</table>`:'<div class="empty">No hay operaciones.</div>'}</div>`
}

function orders(){
 const q=(window.orderQ||'').toLowerCase(),sf=window.orderSupplier||'';
 const rows=db.orders.slice().sort((a,b)=>b.number.localeCompare(a.number)).filter(o=>(!sf||o.supplierId===sf)&&(!q||[o.number,o.op,o.customerName,o.tour,supplier(o.supplierId)].join(' ').toLowerCase().includes(q)));
 return `<div class="toolbar"><div><h2>Órdenes de compra</h2><small>La OC se genera primero. La factura se crea opcionalmente desde la OC.</small></div><button class="primary" onclick="orderForm()">+ Nueva OC</button></div>
 <div class="card"><div class="filters"><div class="field"><label>Proveedor</label><select onchange="window.orderSupplier=this.value;render()"><option value="">Todos</option>${db.suppliers.map(s=>`<option value="${s.id}" ${sf===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>Buscar</label><input value="${esc(window.orderQ||'')}" oninput="window.orderQ=this.value;render()" placeholder="OC, cliente, tour..."></div></div></div>
 <div class="card">${rows.length?`<table><tr><th>OC</th><th>Operación</th><th>Cliente</th><th>Vendedor</th><th>Tour</th><th>Proveedor</th><th>Servicio</th><th>Total</th><th>Pago</th><th>Acciones</th></tr>${rows.map(o=>`<tr><td>${o.number}</td><td>${o.op}</td><td>${esc(o.customerName)}</td><td>${esc(o.seller)}</td><td>${esc(o.tour)}</td><td>${esc(supplier(o.supplierId))}</td><td>${o.serviceDate}<br>${o.time||''}</td><td>${money(o.total)}</td><td><span class="badge ${o.paymentStatus==='Pagado'?'':'pending'}">${o.paymentStatus}</span></td><td><button class="secondary" onclick="orderForm('${o.id}')">Editar</button> <button class="secondary" onclick="previewOrder('${o.id}')">Vista previa</button> ${o.saleId?`<button class="secondary" onclick="previewSale('${o.saleId}')">Ver factura</button>`:`<button class="primary" onclick="saleForm('${o.id}')">Generar factura</button>`}</td></tr>`).join('')}</table>`:'<div class="empty">No hay órdenes.</div>'}</div>`
}

function orderForm(id=null){
 if(!db.clients.length||!db.tours.length||!db.suppliers.length||!db.sellers.length)return alert('Primero cree cliente, tour, proveedor y vendedor.');
 const o=id?db.orders.find(x=>x.id===id):null;
 modal(o?'Editar OC':'Nueva OC',`<div class="grid">
 <div class="field"><label>Cliente / cuenta</label><select id="ocClient">${db.clients.map(c=>`<option value="${c.id}" ${c.id===o?.clientId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
 <div class="field"><label>Nombre del Cliente / pasajero *</label><input id="ocPassenger" value="${esc(o?.customerName||'')}"></div>
 <div class="field"><label>Tour</label><select id="ocTour" onchange="orderCostFromTour()">${db.tours.map(t=>`<option value="${t.id}" ${t.id===o?.tourId?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div>
 <div class="field"><label>Proveedor</label><select id="ocSupplier">${db.suppliers.map(s=>`<option value="${s.id}" ${s.id===o?.supplierId?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>
 <div class="field"><label>Vendedor *</label><select id="ocSeller"><option value="">Seleccione un vendedor</option>${db.sellers.map(s=>`<option value="${s.id}" ${s.id===o?.sellerId?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>
 <div class="field"><label>Fecha de emisión</label><input id="ocIssue" type="date" value="${o?.issueDate||new Date().toISOString().slice(0,10)}"></div>
 <div class="field"><label>Fecha de servicio *</label><input id="ocService" type="date" value="${o?.serviceDate||''}"></div>
 <div class="field"><label>Hora</label><input id="ocTime" type="time" value="${o?.time||''}"></div>
 <div class="field"><label>Pickup</label><input id="ocPlace" value="${esc(o?.place||'')}"></div>
 <div class="field"><label>Pasajeros</label><input id="ocPax" type="number" min="1" value="${o?.pax||1}" oninput="orderCalc()"></div>
 <div class="field"><label>Costo unitario</label><input id="ocCost" type="number" step=".01" value="${o?.unitCost??(db.tours.find(t=>t.id===o?.tourId)||db.tours[0]).cost}" oninput="orderCalc()"></div>
 <div class="field"><label>Moneda</label><select id="ocCurrency"><option ${o?.currency!=='CRC'?'selected':''}>USD</option><option ${o?.currency==='CRC'?'selected':''}>CRC</option></select></div>
 <div class="field"><label style="display:flex;align-items:center;gap:8px;margin-top:28px"><input id="ocTaxApply" type="checkbox" ${o?.taxRate===0?'':'checked'} onchange="orderCalc()"> Aplicar IVA 13%</label></div>
 <div class="field full"><label>Observaciones</label><textarea id="ocNotes">${esc(o?.notes||'')}</textarea></div>
 <div class="card full">Subtotal: <b id="ocSub"></b> · IVA 13%: <b id="ocTax"></b> · TOTAL: <b id="ocTotal"></b></div></div>
 <div class="actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="${o?`saveOrder('${id}')`:'createOrder()'}">Guardar OC</button></div>`);
 orderCalc()
}
function orderCostFromTour(){const t=db.tours.find(x=>x.id===$('ocTour').value);if(t)$('ocCost').value=t.cost;orderCalc()}
function orderCalc(){const base=(+$('ocPax')?.value||0)*(+$('ocCost')?.value||0);const x=calc(base,$('ocTaxApply')?.checked!==false);$('ocSub').textContent=money(x.subtotal);$('ocTax').textContent=money(x.tax);$('ocTotal').textContent=money(x.total)}
function orderData(){
 const sellerId=$('ocSeller').value,passenger=$('ocPassenger').value.trim(),service=$('ocService').value;
 if(!sellerId)return alert('Debe seleccionar un vendedor.'); if(!passenger||!service)return alert('Complete el nombre del cliente/pasajero y la fecha de servicio.');
 const t=db.tours.find(x=>x.id===$('ocTour').value),c=db.clients.find(x=>x.id===$('ocClient').value),applyTax=$('ocTaxApply')?.checked!==false,x=calc((+$('ocPax').value||0)*(+$('ocCost').value||0),applyTax);
 return {clientId:c.id,client:c.name,customerName:passenger,tourId:t.id,tour:t.name,supplierId:$('ocSupplier').value,sellerId,seller:seller(sellerId),issueDate:$('ocIssue').value,serviceDate:service,time:$('ocTime').value,place:$('ocPlace').value,pax:+$('ocPax').value||0,unitCost:+$('ocCost').value||0,subtotal:x.subtotal,taxRate:applyTax?13:0,tax:x.tax,total:x.total,currency:$('ocCurrency').value,notes:$('ocNotes').value}
}
async function createOrder(){
 const d=orderData();
 if(!d)return;

 const btn=document.querySelector('.modal .primary');
 if(btn){btn.disabled=true;btn.textContent='Guardando...';}

 try{
   const r=await fetch('/api/purchase-orders',{
     method:'POST',
     headers:{'Content-Type':'application/json'},
     body:JSON.stringify(d)
   });

   const data=await r.json();

   if(!r.ok){
     throw new Error(data.error||'No fue posible crear la OC.');
   }

   const x=data.order;

   const o={
     id:x.id,
     number:x.number,
     op:x.operation_number,
     clientId:x.client_id,
     client:d.client,
     supplierId:x.supplier_id,
     sellerId:x.seller_id,
     tourId:x.tour_id,
     customerName:x.client_name,
     issueDate:x.issue_date,
     serviceDate:x.service_date,
     time:x.service_time||'',
     place:x.pickup_place||'',
     pax:Number(x.passengers||0),
     unitCost:Number(x.unit_cost||0),
     subtotal:Number(x.subtotal||0),
     taxRate:Number(x.tax_rate||13),
     tax:Number(x.tax_amount||0),
     total:Number(x.total||0),
     currency:x.currency||'USD',
     notes:x.notes||'',
     paymentStatus:x.payment_status||'Pendiente',
     paymentDate:x.payment_date,
     paymentReceipt:x.payment_receipt,
     saleId:x.sale_id,
     updatedAt:x.updated_at,
     seller:d.seller,
     tour:d.tour
   };

   db.orders.push(o);

   closeModal();
   alert('OC '+o.number+' creada.');

   view='orders';
   render();

 }catch(e){
   if(btn){btn.disabled=false;btn.textContent='Guardar OC';}
   alert(e.message);
 }
}

async function saveOrder(id){
 const o=db.orders.find(x=>x.id===id);
 const d=orderData();

 if(!o||!d)return;

 const btn=document.querySelector('.modal .primary');
 if(btn){btn.disabled=true;btn.textContent='Guardando...';}

 try{
   const r=await fetch('/api/purchase-orders/'+encodeURIComponent(id),{
     method:'PUT',
     headers:{'Content-Type':'application/json'},
     body:JSON.stringify({
       ...d,
       updatedAt:o.updatedAt
     })
   });

   const data=await r.json();

   if(r.status===409){
     alert(data.error||'Esta OC fue modificada por otro usuario. Recargue la información antes de guardarla.');
     return;
   }

   if(!r.ok){
     throw new Error(data.error||'No fue posible actualizar la OC.');
   }

   const x=data.order;

   Object.assign(o,{
     id:x.id,
     number:x.number,
     op:x.operation_number,
     clientId:x.client_id,
     client:d.client,
     supplierId:x.supplier_id,
     sellerId:x.seller_id,
     tourId:x.tour_id,
     customerName:x.client_name,
     issueDate:x.issue_date,
     serviceDate:x.service_date,
     time:x.service_time||'',
     place:x.pickup_place||'',
     pax:Number(x.passengers||0),
     unitCost:Number(x.unit_cost||0),
     subtotal:Number(x.subtotal||0),
     taxRate:Number(x.tax_rate||13),
     tax:Number(x.tax_amount||0),
     total:Number(x.total||0),
     currency:x.currency||'USD',
     notes:x.notes||'',
     paymentStatus:x.payment_status||o.paymentStatus||'Pendiente',
     paymentDate:x.payment_date,
     paymentReceipt:x.payment_receipt,
     saleId:x.sale_id,
     updatedAt:x.updated_at,
     seller:d.seller,
     tour:d.tour
   });

   closeModal();
   alert('OC '+o.number+' actualizada.');

   view='orders';
   render();

 }catch(e){
   alert(e.message);
 }finally{
   if(btn){btn.disabled=false;btn.textContent='Guardar OC';}
 }
}

function company(title){return `<div class="center"><b>${COMPANY.commercial}</b><br>${COMPANY.legal}<br>${COMPANY.phone}<br>${COMPANY.email}<br>${COMPANY.address}<hr><b>${title}</b></div>`}
function orderDoc(o,ticket=false){const base=company('ORDEN DE COMPRA');return ticket?`<div class="ticket">${base}<b>OC:</b> ${o.number}<br><b>Operación:</b> ${o.op}<br><b>Proveedor:</b> ${esc(supplier(o.supplierId))}<br><b>Cliente:</b> ${esc(o.customerName)}<br><b>Vendedor:</b> ${esc(o.seller)}<br><b>Tour:</b> ${esc(o.tour)}<br><b>Servicio:</b> ${o.serviceDate} ${o.time||''}<br><b>Pickup:</b> ${esc(o.place||'-')}<br><b>Pax:</b> ${o.pax}<hr>Subtotal ${money(o.subtotal)}<br>${Number(o.taxRate||0)>0?'IVA 13% '+money(o.tax):'IVA: No aplica'}<br><b>TOTAL ${money(o.total)}</b></div>`:`<div class="document">${base}<div class="meta"><b>OC:</b> ${o.number}<br><b>Operación:</b> ${o.op}<br><b>Proveedor:</b> ${esc(supplier(o.supplierId))}<br><b>Nombre del Cliente:</b> ${esc(o.customerName)}<br><b>Vendedor:</b> ${esc(o.seller)}<br><b>Tour:</b> ${esc(o.tour)}<br><b>Fecha del servicio:</b> ${o.serviceDate}<br><b>Hora:</b> ${o.time||'-'}<br><b>Pickup:</b> ${esc(o.place||'-')}<br><b>Pasajeros:</b> ${o.pax}</div><hr>Subtotal: ${money(o.subtotal)}<br>${Number(o.taxRate||0)>0?'IVA 13%: '+money(o.tax):'IVA: No aplica'}<div class="total">TOTAL: ${money(o.total)}</div><p>${esc(o.notes||'')}</p></div>`}
function previewOrder(id){const o=db.orders.find(x=>x.id===id);if(o)preview('Vista previa — '+o.number,orderDoc(o),`printOrder('${id}')`)}
function printOrder(id){const o=db.orders.find(x=>x.id===id);if(o)printRaw(orderDoc(o,true))}

function payments(){
 return `<div class="toolbar"><h2>Pagos a proveedores</h2></div>
 <div class="card"><div class="filters"><div class="field"><label>Proveedor</label><select id="paySupplier"><option value="">Todos</option>${db.suppliers.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>Buscar OC / operación / cliente</label><input id="paySearch" placeholder="OC-000001"></div><button class="secondary" onclick="paySelectAll()">Seleccionar todos</button><button class="secondary" onclick="payClear()">Limpiar</button></div><div id="pendingPayments"></div><div class="actions"><button class="primary" onclick="payOpenForm()">Aplicar pago</button></div></div>
 <div class="card"><h3>Historial de pagos</h3><div class="filters"><div class="field"><label>Proveedor</label><select id="historySupplier"><option value="">Todos</option>${db.suppliers.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>Buscar pago / OC / comprobante</label><input id="historySearch" placeholder="P-000001 o TRX-123"></div></div><div id="paymentHistory"></div></div>`
}
function renderPayments(){
 const sf=$('paySupplier').value,q=$('paySearch').value.trim().toLowerCase();
 const rows=db.orders.filter(o=>o.paymentStatus!=='Pagado'&&(!sf||o.supplierId===sf)&&(!q||[o.number,o.op,o.customerName,o.tour,supplier(o.supplierId)].join(' ').toLowerCase().includes(q)));
 $('pendingPayments').innerHTML=rows.length?`<table><tr><th><input id="payAll" type="checkbox" onchange="paySelectAll(this.checked)"></th><th>OC</th><th>Proveedor</th><th>Cliente</th><th>Tour</th><th>Servicio</th><th>Total</th><th></th></tr>${rows.map(o=>`<tr><td><input class="payItem" type="checkbox" value="${o.id}"></td><td>${o.number}</td><td>${esc(supplier(o.supplierId))}</td><td>${esc(o.customerName)}</td><td>${esc(o.tour)}</td><td>${o.serviceDate}</td><td>${money(o.total)}</td><td><button class="secondary" onclick="previewOrder('${o.id}')">Ver OC</button></td></tr>`).join('')}</table>`:'<div class="empty">No hay OCs pendientes con esos filtros.</div>';
 const hf=$('historySupplier').value,hq=$('historySearch').value.trim().toLowerCase();
 const ps=db.payments.filter(p=>(!hf||p.supplierId===hf)&&(!hq||[p.number,p.receipt,supplier(p.supplierId),...(p.orderIds||[]).map(i=>db.orders.find(o=>o.id===i)?.number||'')].join(' ').toLowerCase().includes(hq))).slice().reverse();
 $('paymentHistory').innerHTML=ps.length?`<table><tr><th>Pago</th><th>Proveedor</th><th>Fecha</th><th>Comprobante</th><th>Total</th><th>OCs</th><th>Acción</th></tr>${ps.map(p=>`<tr><td>${p.number}</td><td>${esc(supplier(p.supplierId))}</td><td>${p.date}</td><td>${esc(p.receipt)}</td><td>${money(p.total)}</td><td>${(p.orderIds||[]).map(i=>db.orders.find(o=>o.id===i)?.number||'').join(', ')}</td><td><button class="secondary" onclick="previewPayment('${p.id}')">Vista previa</button></td></tr>`).join('')}</table>`:'<div class="empty">No hay pagos registrados.</div>';
}
function paySelectAll(force){const items=document.querySelectorAll('.payItem');items.forEach(x=>x.checked=force===undefined?true:force)}
function payClear(){document.querySelectorAll('.payItem').forEach(x=>x.checked=false);if($('payAll'))$('payAll').checked=false}
function selectedOrders(){return [...document.querySelectorAll('.payItem:checked')].map(x=>db.orders.find(o=>o.id===x.value)).filter(Boolean)}
let pendingPaymentOrderIds=[];
function payOpenForm(){
 const os=selectedOrders();if(!os.length)return alert('Seleccione al menos una OC para pagar.');
 const ss=[...new Set(os.map(o=>o.supplierId))];if(ss.length!==1)return alert('Seleccione OCs de un solo proveedor.');
 const total=os.reduce((a,o)=>a+Number(o.total||0),0);
 pendingPaymentOrderIds=os.map(o=>o.id);
 modal('Registrar pago',`<div class="notice"><b>${os.length}</b> OC(s) · Proveedor: <b>${esc(supplier(ss[0]))}</b> · Total: <b>${money(total)}</b></div>
 <div class="grid"><div class="field"><label>Fecha de pago *</label><input id="paymentDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Número de comprobante *</label><input id="paymentReceipt" placeholder="TRX-12345"></div></div>
 <div class="actions"><button id="cancelPayment" class="secondary">Cancelar</button><button id="applyPaymentBtn" class="primary">Aplicar pago</button></div>`);
 $('cancelPayment').addEventListener('click',closeModal);
 $('applyPaymentBtn').addEventListener('click',applyPayment);
}
function applyPayment(){
 const ids=[...pendingPaymentOrderIds];
 if(!ids.length)return alert('No hay OCs seleccionadas para este pago.');
 const date=$('paymentDate').value,receipt=$('paymentReceipt').value.trim();if(!date||!receipt)return alert('Complete fecha y número de comprobante.');
 const os=ids.map(i=>db.orders.find(o=>o.id===i)).filter(Boolean),ss=[...new Set(os.map(o=>o.supplierId))];
 if(!os.length||ss.length!==1)return alert('Selección de pago inválida.');
 if(os.some(o=>o.paymentStatus==='Pagado'))return alert('Una OC seleccionada ya está pagada. Actualice la pantalla.');
 const p={id:uid(),number:next('P'),supplierId:ss[0],date,receipt,total:os.reduce((a,o)=>a+Number(o.total||0),0),orderIds:os.map(o=>o.id)};
 db.payments.push(p);os.forEach(o=>{o.paymentStatus='Pagado';o.paymentDate=date;o.paymentReceipt=receipt;o.paymentId=p.id});
 pendingPaymentOrderIds=[];
 saveDB();closeModal();alert('Pago '+p.number+' aplicado correctamente.');
}
function paymentDoc(p){const os=(p.orderIds||[]).map(i=>db.orders.find(o=>o.id===i)).filter(Boolean);return `<div class="document">${company('COMPROBANTE DE PAGO A PROVEEDOR')}<div class="meta"><b>Pago:</b> ${p.number}<br><b>Proveedor:</b> ${esc(supplier(p.supplierId))}<br><b>Fecha:</b> ${p.date}<br><b>Comprobante:</b> ${esc(p.receipt)}</div><hr>${os.map(o=>`${o.number} · ${esc(o.customerName)} · ${esc(o.tour)} · ${money(o.total)}`).join('<br>')}<div class="total">TOTAL PAGADO: ${money(p.total)}</div></div>`}
function previewPayment(id){const p=db.payments.find(x=>x.id===id);if(p)preview('Vista previa — '+p.number,paymentDoc(p),`printPayment('${id}')`)}
function printPayment(id){const p=db.payments.find(x=>x.id===id);if(!p)return;const os=(p.orderIds||[]).map(i=>db.orders.find(o=>o.id===i)).filter(Boolean);printRaw(`<div class="ticket">${company('COMPROBANTE DE PAGO')}<b>Pago:</b> ${p.number}<br><b>Proveedor:</b> ${esc(supplier(p.supplierId))}<br><b>Fecha:</b> ${p.date}<br><b>Comprobante:</b> ${esc(p.receipt)}<hr>${os.map(o=>`${o.number} · ${esc(o.tour)} · ${money(o.total)}<br>`).join('')}<hr><b>TOTAL ${money(p.total)}</b></div>`)}

function sales(){
 const rows=db.sales.slice().sort((a,b)=>b.number.localeCompare(a.number));
 return `<div class="toolbar"><h2>Ventas / facturas internas</h2><small>La venta se genera opcionalmente desde la OC.</small></div>
 <div class="card">${rows.length?`<table><tr><th>Venta</th><th>Operación</th><th>Cliente</th><th>Vendedor</th><th>Tour</th><th>Servicio</th><th>Total</th><th>Acción</th></tr>${rows.map(s=>`<tr><td>${s.number}</td><td>${s.op}</td><td>${esc(s.customerName)}</td><td>${esc(s.seller)}</td><td>${esc(s.tour)}</td><td>${s.serviceDate}</td><td>${money(s.total)}</td><td><button class="secondary" onclick="previewSale('${s.id}')">Vista previa</button> <button class="secondary" onclick="editSaleForm('${s.id}')">Editar</button></td></tr>`).join('')}</table>`:'<div class="empty">No hay ventas. Genere la factura desde una OC.</div>'}</div>`
}
function saleForm(orderId){
 const o=db.orders.find(x=>x.id===orderId);if(!o)return;if(o.saleId)return alert('Esta OC ya tiene factura.');
 const t=db.tours.find(x=>x.id===o.tourId);
 modal('Generar factura desde '+o.number,`<div class="grid"><div class="field"><label>Cliente</label><input disabled value="${esc(o.customerName)}"></div><div class="field"><label>Tour</label><input disabled value="${esc(o.tour)}"></div><div class="field"><label>Precio de venta unitario *</label><input id="salePrice" type="number" step=".01" value="${t?.hotel||0}"></div><div class="field"><label>Descuento %</label><input id="saleDiscount" type="number" step=".01" value="0"></div></div><div class="actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="createSale('${orderId}')">Generar factura</button></div>`)
}
function createSale(orderId){
 const o=db.orders.find(x=>x.id===orderId),price=+$('salePrice').value||0,dp=+$('saleDiscount').value||0;
 if(price<=0)return alert('Ingrese el precio de venta.');
 const subtotal=o.pax*price,discount=subtotal*dp/100,x=calc(subtotal-discount);
 const s={id:uid(),number:next('V'),op:o.op,orderId:o.id,clientId:o.clientId,customerName:o.customerName,tourId:o.tourId,tour:o.tour,sellerId:o.sellerId,seller:o.seller,serviceDate:o.serviceDate,pax:o.pax,unitPrice:price,discount:dp,subtotal,discountAmount:discount,tax:x.tax,total:x.total,currency:o.currency};
 db.sales.push(s);o.saleId=s.id;saveDB();closeModal();alert('Factura '+s.number+' creada.');
}
function editSaleForm(id){
 const s=db.sales.find(x=>x.id===id);
 if(!s)return;
 modal('Editar factura '+s.number,`<div class="grid">
 <div class="field"><label>Cliente</label><input disabled value="${esc(s.customerName)}"></div>
 <div class="field"><label>Tour</label><input disabled value="${esc(s.tour)}"></div>
 <div class="field"><label>Precio de venta unitario *</label><input id="saleEditPrice" type="number" step=".01" value="${s.unitPrice||0}"></div>
 <div class="field"><label>Descuento %</label><input id="saleEditDiscount" type="number" step=".01" value="${s.discount||0}"></div>
 </div>
 <div class="card">Subtotal: <b id="saleEditSub"></b> · IVA 13%: <b id="saleEditTax"></b> · TOTAL: <b id="saleEditTotal"></b></div>
 <div class="actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveSaleEdit('${id}')">Guardar cambios</button></div>`);
 saleEditCalc();
}

function saleEditCalc(){
 const s=db.sales.find(x=>x.id===$('saleEditPrice')?.dataset?.saleId);
 const price=+$('saleEditPrice')?.value||0,dp=+$('saleEditDiscount')?.value||0;
 const order=s?db.orders.find(x=>x.id===s.orderId):null;
 const pax=order?.pax||s?.pax||1;
 const subtotal=pax*price,discount=subtotal*dp/100,x=calc(subtotal-discount,true);
 if($('saleEditSub'))$('saleEditSub').textContent=money(x.subtotal);
 if($('saleEditTax'))$('saleEditTax').textContent=money(x.tax);
 if($('saleEditTotal'))$('saleEditTotal').textContent=money(x.total);
}

async function saveSaleEdit(id){
 const s=db.sales.find(x=>x.id===id);
 if(!s)return;
 const price=+$('saleEditPrice').value||0,dp=+$('saleEditDiscount').value||0;
 if(price<=0)return alert('Ingrese el precio de venta.');
 const subtotal=(s.pax||1)*price,discount=subtotal*dp/100,x=calc(subtotal-discount,true);
 Object.assign(s,{unitPrice:price,discount:dp,subtotal,discountAmount:discount,taxableAmount:subtotal-discount,taxRate:13,tax:x.tax,total:x.total});
 saveDB();closeModal();alert('Factura '+s.number+' actualizada.');
}

function saleDoc(s,ticket=false){const base=company('FACTURA INTERNA DE VENTA');return ticket?`<div class="ticket">${base}<b>Factura:</b> ${s.number}<br><b>Operación:</b> ${s.op}<br><b>Cliente:</b> ${esc(s.customerName)}<br><b>Vendedor:</b> ${esc(s.seller)}<br><b>Tour:</b> ${esc(s.tour)}<br><b>Servicio:</b> ${s.serviceDate}<hr>Subtotal ${money(s.subtotal)}<br>Descuento -${money(s.discountAmount)}<br>IVA 13% ${money(s.tax)}<br><b>TOTAL ${money(s.total)}</b></div>`:`<div class="document">${base}<div class="meta"><b>Factura:</b> ${s.number}<br><b>Operación:</b> ${s.op}<br><b>Cliente:</b> ${esc(s.customerName)}<br><b>Vendedor:</b> ${esc(s.seller)}<br><b>Tour:</b> ${esc(s.tour)}<br><b>Fecha de servicio:</b> ${s.serviceDate}<br><b>Pasajeros:</b> ${s.pax}</div><hr>Subtotal: ${money(s.subtotal)}<br>Descuento: -${money(s.discountAmount)}<br>IVA 13%: ${money(s.tax)}<div class="total">TOTAL: ${money(s.total)}</div></div>`}
function previewSale(id){const s=db.sales.find(x=>x.id===id);if(s)preview('Vista previa — '+s.number,saleDoc(s),`printSale('${id}')`)}
function printSale(id){const s=db.sales.find(x=>x.id===id);if(s)printRaw(saleDoc(s,true))}

function reports(){return `<div class="toolbar"><h2>Reportes</h2></div><div class="card"><button class="primary" onclick="reportTab('future')">1. Tours por fecha de servicio</button> <button class="secondary" onclick="reportTab('seller')">2. Vendedores</button> <button class="secondary" onclick="reportTab('analysis')">3. Análisis de ventas</button></div>
<div id="repFuture" class="report active card"><h3>Tours por fecha de servicio</h3><p>La fecha utilizada es la fecha en que se debe operar el tour, no la fecha de venta.</p><div class="filters"><div class="field"><label>Desde</label><input id="rFutureFrom" type="date"></div><div class="field"><label>Hasta</label><input id="rFutureTo" type="date"></div><button class="secondary" onclick="renderReports()">Actualizar</button><button class="secondary" onclick="exportFuture()">Excel</button></div><div id="futureResult"></div></div>
<div id="repSeller" class="report card"><h3>Vendedores por fecha de servicio</h3><div class="filters"><div class="field"><label>Desde</label><input id="rSellerFrom" type="date"></div><div class="field"><label>Hasta</label><input id="rSellerTo" type="date"></div><div class="field"><label>Vendedor</label><select id="rSeller"><option value="">Todos</option>${db.sellers.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div><button class="secondary" onclick="renderReports()">Actualizar</button><button class="secondary" onclick="exportSeller()">Excel</button></div><div id="sellerResult"></div></div>
<div id="repAnalysis" class="report card"><h3>Análisis configurable</h3><div class="filters"><div class="field"><label>Desde</label><input id="rAFrom" type="date"></div><div class="field"><label>Hasta</label><input id="rATo" type="date"></div><div class="field"><label>Agrupar por</label><select id="rGroup"><option value="tour">Tour</option><option value="supplier">Proveedor</option><option value="seller">Vendedor</option><option value="client">Cliente</option></select></div><div class="field"><label>Ordenar</label><select id="rOrder"><option value="desc">Mayor a menor</option><option value="asc">Menor a mayor</option></select></div><div class="field"><label>Límite</label><select id="rLimit"><option value="5">5</option><option value="10">10</option><option value="25">25</option><option value="all">Todos</option></select></div><button class="secondary" onclick="renderReports()">Actualizar</button><button class="secondary" onclick="exportAnalysis()">Excel</button></div><div id="analysisResult"></div></div>`}
function reportTab(which){document.querySelectorAll('.report').forEach(x=>x.style.display='none');$('rep'+(which==='future'?'Future':which==='seller'?'Seller':'Analysis')).style.display='block'}
function reportRows(){const f=$('rFutureFrom')?.value||'',t=$('rFutureTo')?.value||'';return db.orders.filter(o=>(!f||o.serviceDate>=f)&&(!t||o.serviceDate<=t)).sort((a,b)=>(a.serviceDate+a.time).localeCompare(b.serviceDate+b.time))}
function renderReports(){
 if(!$('futureResult'))return;
 const future=reportRows();$('futureResult').innerHTML=future.length?`<table><tr><th>Fecha</th><th>Hora</th><th>Tour</th><th>Cliente</th><th>Vendedor</th><th>Proveedor</th><th>Pickup</th><th>Pax</th><th>OC</th></tr>${future.map(o=>`<tr><td>${o.serviceDate}</td><td>${o.time||'-'}</td><td>${esc(o.tour)}</td><td>${esc(o.customerName)}</td><td>${esc(o.seller)}</td><td>${esc(supplier(o.supplierId))}</td><td>${esc(o.place||'-')}</td><td>${o.pax}</td><td>${o.number}</td></tr>`).join('')}</table>`:'<div class="empty">No hay servicios para el rango indicado.</div>';
 const sf=$('rSellerFrom')?.value||'',st=$('rSellerTo')?.value||'',sv=$('rSeller')?.value||'';
 const ss=db.sales.filter(s=>(!sf||s.serviceDate>=sf)&&(!st||s.serviceDate<=st)&&(!sv||s.sellerId===sv));
 const sellerRows=ss.map(s=>{const o=db.orders.find(x=>x.id===s.orderId),cost=Number(o?.subtotal||0),sale=Number(s.subtotal||0)-Number(s.discountAmount||0),margin=sale-cost,rate=Number(db.sellers.find(x=>x.id===s.sellerId)?.commissionRate||0),commission=Math.max(0,margin)*rate/100;return {s,cost,sale,margin,rate,commission};});
 const sellerTotals=sellerRows.reduce((a,r)=>({sale:a.sale+r.sale,cost:a.cost+r.cost,margin:a.margin+r.margin,commission:a.commission+r.commission}),{sale:0,cost:0,margin:0,commission:0});
 $('sellerResult').innerHTML=sellerRows.length?`<div class="cards" style="grid-template-columns:repeat(4,1fr);margin-bottom:12px"><div class="card"><small>Ventas sin IVA</small><div class="metric">${money(sellerTotals.sale)}</div></div><div class="card"><small>Costos sin IVA</small><div class="metric">${money(sellerTotals.cost)}</div></div><div class="card"><small>Margen</small><div class="metric">${money(sellerTotals.margin)}</div></div><div class="card"><small>Comisión a pagar</small><div class="metric">${money(sellerTotals.commission)}</div></div></div><table><tr><th>Fecha servicio</th><th>Vendedor</th><th>Tour</th><th>Cliente</th><th>Venta</th><th>Costo</th><th>Margen</th><th>%</th><th>Comisión</th></tr>${sellerRows.map(r=>`<tr><td>${r.s.serviceDate}</td><td>${esc(r.s.seller)}</td><td>${esc(r.s.tour)}</td><td>${esc(r.s.customerName)}</td><td>${money(r.sale)}</td><td>${money(r.cost)}</td><td>${money(r.margin)}</td><td>${r.rate}%</td><td>${money(r.commission)}</td></tr>`).join('')}<tr><th colspan="4">TOTAL</th><th>${money(sellerTotals.sale)}</th><th>${money(sellerTotals.cost)}</th><th>${money(sellerTotals.margin)}</th><th></th><th>${money(sellerTotals.commission)}</th></tr></table>`:'<div class="empty">No hay ventas para el rango.</div>';
 const af=$('rAFrom')?.value||'',at=$('rATo')?.value||'',g=$('rGroup')?.value||'tour',ord=$('rOrder')?.value||'desc',lim=$('rLimit')?.value||'5';
 const base=db.orders.filter(o=>(!af||o.serviceDate>=af)&&(!at||o.serviceDate<=at)),map={};
 base.forEach(o=>{const key=g==='tour'?o.tour:g==='supplier'?supplier(o.supplierId):g==='seller'?o.seller:o.client;if(!map[key])map[key]={name:key,services:0,pax:0,sales:0,cost:0};map[key].services++;map[key].pax+=o.pax||0;map[key].cost+=o.subtotal||0;const s=db.sales.find(x=>x.orderId===o.id);if(s)map[key].sales+=s.subtotal-s.discountAmount});
 let ar=Object.values(map).sort((a,b)=>ord==='desc'?b.services-a.services:a.services-b.services);if(lim!=='all')ar=ar.slice(0,+lim);
 const analysisTotals=ar.reduce((a,x)=>({services:a.services+x.services,pax:a.pax+x.pax,sales:a.sales+x.sales,cost:a.cost+x.cost}),{services:0,pax:0,sales:0,cost:0});
 $('analysisResult').innerHTML=ar.length?`<div class="cards" style="grid-template-columns:repeat(5,1fr);margin-bottom:12px"><div class="card"><small>Servicios</small><div class="metric">${analysisTotals.services}</div></div><div class="card"><small>Pasajeros</small><div class="metric">${analysisTotals.pax}</div></div><div class="card"><small>Ventas sin IVA</small><div class="metric">${money(analysisTotals.sales)}</div></div><div class="card"><small>Costos sin IVA</small><div class="metric">${money(analysisTotals.cost)}</div></div><div class="card"><small>Margen</small><div class="metric">${money(analysisTotals.sales-analysisTotals.cost)}</div></div></div><table><tr><th>${g==='tour'?'Tour':g==='supplier'?'Proveedor':g==='seller'?'Vendedor':'Cliente'}</th><th>Servicios</th><th>Pax</th><th>Ventas sin IVA</th><th>Costos sin IVA</th><th>Margen</th></tr>${ar.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.services}</td><td>${x.pax}</td><td>${money(x.sales)}</td><td>${money(x.cost)}</td><td>${money(x.sales-x.cost)}</td></tr>`).join('')}<tr><th>TOTAL</th><th>${analysisTotals.services}</th><th>${analysisTotals.pax}</th><th>${money(analysisTotals.sales)}</th><th>${money(analysisTotals.cost)}</th><th>${money(analysisTotals.sales-analysisTotals.cost)}</th></tr></table>`:'<div class="empty">No hay datos.</div>';
}
function toExcel(rows,file,totals=null){if(!rows.length)return alert('No hay datos para exportar.');if(typeof XLSX==='undefined')return alert('No se pudo cargar el generador de Excel. Recargue la página e inténtelo nuevamente.');const data=rows.map(r=>({...r}));if(totals)data.push(totals);const ws=XLSX.utils.json_to_sheet(data);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Reporte');XLSX.writeFile(wb,file)}
function exportFuture(){const rows=reportRows().map(o=>({OC:o.number,FechaServicio:o.serviceDate,Hora:o.time||'',Tour:o.tour,Cliente:o.customerName,Vendedor:o.seller,Proveedor:supplier(o.supplierId),Pickup:o.place||'',Pax:Number(o.pax||0),Total:Number(o.total||0)}));const totalPax=rows.reduce((a,r)=>a+r.Pax,0),total=rows.reduce((a,r)=>a+r.Total,0);toExcel(rows,'tours_fecha_servicio.xlsx',{OC:'TOTAL',FechaServicio:'',Hora:'',Tour:'',Cliente:'',Vendedor:'',Proveedor:'',Pickup:'',Pax:totalPax,Total:total})}
function exportSeller(){const f=$('rSellerFrom').value,t=$('rSellerTo').value,sv=$('rSeller').value,ss=db.sales.filter(s=>(!f||s.serviceDate>=f)&&(!t||s.serviceDate<=t)&&(!sv||s.sellerId===sv));const rows=ss.map(s=>{const o=db.orders.find(x=>x.id===s.orderId),cost=Number(o?.subtotal||0),sale=Number(s.subtotal||0)-Number(s.discountAmount||0),margin=sale-cost,rate=Number(db.sellers.find(x=>x.id===s.sellerId)?.commissionRate||0),commission=Math.max(0,margin)*rate/100;return{FechaServicio:s.serviceDate,Vendedor:s.seller,Tour:s.tour,Cliente:s.customerName,Venta:sale,Costo:cost,Margen:margin,ComisionPorcentaje:rate,Comision:commission}});const totals=rows.reduce((a,r)=>({FechaServicio:'',Vendedor:'',Tour:'',Cliente:'TOTAL',Venta:a.Venta+r.Venta,Costo:a.Costo+r.Costo,Margen:a.Margen+r.Margen,ComisionPorcentaje:'',Comision:a.Comision+r.Comision}),{Venta:0,Costo:0,Margen:0,Comision:0});toExcel(rows,'vendedores_comisiones.xlsx',totals)}
function exportAnalysis(){const f=$('rAFrom').value,t=$('rATo').value,g=$('rGroup').value,rows=db.orders.filter(o=>(!f||o.serviceDate>=f)&&(!t||o.serviceDate<=t)),map={};rows.forEach(o=>{const k=g==='tour'?o.tour:g==='supplier'?supplier(o.supplierId):g==='seller'?o.seller:o.client;if(!map[k])map[k]={Nombre:k,Servicios:0,Pasajeros:0,VentasSinIVA:0,CostosSinIVA:0};map[k].Servicios++;map[k].Pasajeros+=Number(o.pax||0);map[k].CostosSinIVA+=Number(o.subtotal||0);const s=db.sales.find(x=>x.orderId===o.id);if(s)map[k].VentasSinIVA+=Number(s.subtotal||0)-Number(s.discountAmount||0)});const out=Object.values(map).map(x=>({Nombre:x.Nombre,Servicios:x.Servicios,Pasajeros:x.Pasajeros,VentasSinIVA:x.VentasSinIVA,CostosSinIVA:x.CostosSinIVA,Margen:x.VentasSinIVA-x.CostosSinIVA}));const totals=out.reduce((a,r)=>({Nombre:'TOTAL',Servicios:a.Servicios+r.Servicios,Pasajeros:a.Pasajeros+r.Pasajeros,VentasSinIVA:a.VentasSinIVA+r.VentasSinIVA,CostosSinIVA:a.CostosSinIVA+r.CostosSinIVA,Margen:a.Margen+r.Margen}),{Servicios:0,Pasajeros:0,VentasSinIVA:0,CostosSinIVA:0,Margen:0});toExcel(out,'analisis_tours_proveedores.xlsx',totals)}

function clients(){return listView('Clientes','client',db.clients.map(c=>[c.name,c.type||'',c.phone||'',c.currency||'USD']),['Nombre','Tipo','Teléfono','Moneda'])}
function suppliers(){return `<div class="toolbar"><h2>Proveedores</h2><button class="primary" onclick="simpleForm('supplier')">+ Nuevo proveedor</button></div><div class="card">${db.suppliers.length?`<table><tr><th>Proveedor</th><th>Contacto</th><th>Teléfono</th><th>Email</th><th>Acción</th></tr>${db.suppliers.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.contact||'')}</td><td>${esc(s.phone||'')}</td><td>${esc(s.email||'')}</td><td><button class="secondary" onclick="simpleForm('supplier','${s.id}')">Editar</button></td></tr>`).join('')}</table>`:'<div class="empty">No hay proveedores.</div>'}</div>`}
function sellers(){return listView('Vendedores','seller',db.sellers.map(s=>[s.name,s.commissionRate+'%']),['Vendedor','Comisión sobre margen'])}
function listView(title,type,rows,heads){return `<div class="toolbar"><h2>${title}</h2><button class="primary" onclick="simpleForm('${type}')">+ Nuevo</button></div><div class="card">${rows.length?`<table><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</table>`:'<div class="empty">No hay registros.</div>'}</div>`}
function simpleForm(type,id=null){
 const existing=id?(db[type==='supplier'?'suppliers':type==='client'?'clients':'sellers']||[]).find(x=>x.id===id):null;
 const title=type==='client'?(existing?'Editar cliente':'Nuevo cliente'):type==='supplier'?(existing?'Editar proveedor':'Nuevo proveedor'):(existing?'Editar vendedor':'Nuevo vendedor');
 modal(title,`<div class="grid"><div class="field"><label>Nombre *</label><input id="simpleName" value="${esc(existing?.name||'')}"></div>${type==='client'?'<div class="field"><label>Tipo</label><select id="simpleType"><option>Cliente directo</option><option>Hotel</option><option>Agencia</option></select></div>':''}${type==='supplier'?`<div class="field"><label>Contacto</label><input id="simpleContact" value="${esc(existing?.contact||'')}"></div>`:''}<div class="field"><label>Teléfono</label><input id="simplePhone" value="${esc(existing?.phone||'')}"></div><div class="field"><label>${type==='supplier'?'Email':'Comisión (%)'}</label><input id="simpleExtra" ${type==='supplier'?'type="email"':'type="number" step=".01"'} value="${type==='supplier'?esc(existing?.email||''):(existing?.commissionRate||0)}"></div></div><div class="actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveSimple('${type}','${id||''}')">Guardar</button></div>`)
}
function saveSimple(type,id=''){
 const n=$('simpleName').value.trim();
 if(!n)return alert('Ingrese el nombre.');
 if(type==='supplier'){
   const item=id?db.suppliers.find(x=>x.id===id):{id:uid()};
   Object.assign(item,{name:n,contact:$('simpleContact').value.trim(),phone:$('simplePhone').value.trim(),email:$('simpleExtra').value.trim()});
   if(!id)db.suppliers.push(item);
 }
 if(type==='client'){
   const item=id?db.clients.find(x=>x.id===id):{id:uid()};
   Object.assign(item,{name:n,type:$('simpleType').value,phone:$('simplePhone').value,currency:item.currency||'USD'});
   if(!id)db.clients.push(item);
 }
 if(type==='seller'){
   const item=id?db.sellers.find(x=>x.id===id):{id:uid()};
   Object.assign(item,{name:n,commissionRate:+$('simpleExtra').value||0});
   if(!id)db.sellers.push(item);
 }
 saveDB();closeModal();
}
function tours(){return `<div class="toolbar"><h2>Tours y tarifas</h2><button class="primary" onclick="tourForm()">+ Nuevo tour</button></div><div class="card">${db.tours.length?`<table><tr><th>Tour</th><th>Precio hotel</th><th>Costo</th><th>Margen</th><th></th></tr>${db.tours.map(t=>`<tr><td>${esc(t.name)}</td><td>${money(t.hotel)}</td><td>${money(t.cost)}</td><td>${money(t.hotel-t.cost)}</td><td><button class="secondary" onclick="tourForm('${t.id}')">Editar</button></td></tr>`).join('')}</table>`:'<div class="empty">No hay tours.</div>'}</div>`}
function tourForm(id=null){const t=id?db.tours.find(x=>x.id===id):null;modal(t?'Editar tour':'Nuevo tour',`<div class="grid"><div class="field"><label>Tour *</label><input id="tourName" value="${esc(t?.name||'')}"></div><div class="field"><label>Precio hotel</label><input id="tourHotel" type="number" step=".01" value="${t?.hotel||0}"></div><div class="field"><label>Costo</label><input id="tourCost" type="number" step=".01" value="${t?.cost||0}"></div></div><div class="actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveTour('${id||''}')">Guardar</button></div>`)}
function saveTour(id){const n=$('tourName').value.trim();if(!n)return alert('Ingrese el tour.');const d={name:n,hotel:+$('tourHotel').value||0,cost:+$('tourCost').value||0};if(id)Object.assign(db.tours.find(t=>t.id===id),d);else db.tours.push({id:uid(),...d});saveDB();closeModal()}

async function init(){try{db=await loadDB();appReady=true;render()}catch(e){console.error(e);document.getElementById('app').innerHTML='<div class="card"><h2>No se pudo conectar con la base de datos</h2><p>'+esc(e.message)+'</p><button class="primary" onclick="location.reload()">Reintentar</button></div>'}}
init();
</script>

<section id="tm-users-admin" style="display:none;padding:24px;max-width:1250px;margin:auto;">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px;">
    <div><h2 style="margin:0 0 6px">Usuarios y permisos</h2><p style="margin:0;opacity:.7">Configura exactamente qué puede hacer cada usuario.</p></div>
    <button type="button" id="tm-user-new">+ Nuevo usuario</button>
  </div>
  <div style="display:grid;grid-template-columns:280px 1fr;gap:18px">
    <div style="border:1px solid #ddd;border-radius:12px;padding:14px;background:#fff">
      <div id="tm-users-list"></div>
    </div>
    <div style="border:1px solid #ddd;border-radius:12px;padding:18px;background:#fff">
      <form id="tm-user-form">
        <input type="hidden" id="tm-user-id">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <label>Nombre<input id="tm-user-name" required></label>
          <label>Correo<input id="tm-user-email" type="email" required></label>
          <label>Rol<select id="tm-user-role"><option value="user">Usuario</option><option value="admin">Administrador</option></select></label>
          <label>Estado<select id="tm-user-active"><option value="true">Activo</option><option value="false">Inactivo</option></select></label>
          <label style="grid-column:1/-1">Contraseña<input id="tm-user-password" type="password" autocomplete="new-password"><small>Vacío al editar = conservar contraseña.</small></label>
        </div>
        <h3>Permisos</h3>
        <div style="display:flex;gap:8px;margin-bottom:10px">
          <button type="button" id="tm-perm-all">Seleccionar todo</button>
          <button type="button" id="tm-perm-none">Quitar todo</button>
        </div>
        <div id="tm-permissions-grid"></div>
        <div style="display:flex;gap:8px;margin-top:18px">
          <button type="submit">Guardar usuario</button>
          <button type="button" id="tm-user-cancel">Cancelar</button>
        </div>
        <div id="tm-user-message" style="margin-top:10px"></div>
      </form>
    </div>
  </div>
</section>
<style>
#tm-users-admin label{display:flex;flex-direction:column;gap:6px;font-weight:600}
#tm-users-admin input,#tm-users-admin select{padding:9px;border:1px solid #ccc;border-radius:7px}
#tm-users-admin button{padding:9px 13px;border:0;border-radius:7px;cursor:pointer}
.tm-uitem{padding:11px;border-bottom:1px solid #eee;cursor:pointer}.tm-uitem strong{display:block}.tm-uitem small{opacity:.65}
.tm-pgroup{border:1px solid #e3e3e3;border-radius:9px;margin:10px 0;overflow:hidden}
.tm-ptitle{padding:9px 11px;background:#f6f6f6;font-weight:700}
.tm-prow{display:grid;grid-template-columns:1fr 75px 75px 75px 75px;align-items:center;padding:8px 11px;border-top:1px solid #eee}
.tm-prow input{width:17px;height:17px}
@media(max-width:800px){#tm-users-admin>div:nth-child(2){grid-template-columns:1fr!important}#tm-user-form>div:first-of-type{grid-template-columns:1fr!important}.tm-prow{grid-template-columns:1fr 50px 50px 50px 50px}}
</style>
<script>
(function(){
const catalog=[
['Clientes','clients',['view','create','edit','delete']],
['Proveedores','suppliers',['view','create','edit','delete']],
['Vendedores','sellers',['view','create','edit','delete']],
['Tours','tours',['view','create','edit','delete']],
['Órdenes de compra','purchase_orders',['view','create','edit','delete']],
['Ventas','sales',['view','create','edit','delete']],
['Pagos','payments',['view','create','edit','delete']],
['Reportes','reports',['service_dates.view','sellers.view','sales_analysis.view','best_sellers.view']],
['Usuarios','users',['view','create','edit','delete']],
['Configuración','settings',['view','edit']]
];
const labels={view:'Ver',create:'Crear',edit:'Editar',delete:'Eliminar',
'service_dates.view':'Tours por fecha','sellers.view':'Vendedores / comisiones',
'sales_analysis.view':'Análisis de ventas','best_sellers.view':'Más vendidos'};
const $=id=>document.getElementById(id);
async function api(url,opt){const r=await fetch(url,Object.assign({headers:{'Content-Type':'application/json'}},opt||{}));const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Error de servidor');return d}
function renderPermissions(selected=[]){
 const s=new Set(selected);
 $('tm-permissions-grid').innerHTML=catalog.map(([title,prefix,acts])=>{
  const report=prefix==='reports';
  if(report) return '<div class="tm-pgroup"><div class="tm-ptitle">'+title+'</div>'+
   acts.map(a=>{let p=prefix+'.'+a;return '<label class="tm-prow"><span>'+labels[a]+'</span><span></span><span><input type="checkbox" data-perm="'+p+'" '+(s.has(p)?'checked':'')+'></span><span></span><span></span></label>'}).join('')+'</div>';
  return '<div class="tm-pgroup"><div class="tm-ptitle">'+title+'</div>'+
   '<div class="tm-prow" style="font-weight:600"><span></span><span>Ver</span><span>Crear</span><span>Editar</span><span>Eliminar</span></div>'+
   acts.map(a=>'<label class="tm-prow"><span>'+title+'</span><span><input type="checkbox" data-perm="'+prefix+'.'+a+'" '+(s.has(prefix+'.'+a)?'checked':'')+'></span><span></span><span></span><span></span></label>').join('')+
   '</div>';
 }).join('');
 // For CRUD modules, one row per action would be confusing; replace with proper matrix.
 document.querySelectorAll('.tm-pgroup').forEach((g,i)=>{
  if(i===7) return;
  const [title,prefix,acts]=catalog[i];
  g.innerHTML='<div class="tm-ptitle">'+title+'</div><div class="tm-prow" style="font-weight:600"><span></span><span>Ver</span><span>Crear</span><span>Editar</span><span>Eliminar</span></div>'+
   '<div class="tm-prow"><span>Permisos</span>'+acts.map(a=>'<span><input type="checkbox" data-perm="'+prefix+'.'+a+'" '+(s.has(prefix+'.'+a)?'checked':'')+'></span>').join('')+'</div>';
 });
}
async function loadUsers(){
 const d=await api('/api/users');
 $('tm-users-list').innerHTML=d.users.map(u=>'<div class="tm-uitem" data-id="'+u.id+'"><strong>'+u.name+'</strong><small>'+u.email+'<br>'+(u.active?'Activo':'Inactivo')+'</small></div>').join('')||'<p>No hay usuarios.</p>';
 document.querySelectorAll('.tm-uitem').forEach(x=>x.onclick=()=>editUser(x.dataset.id));
}
async function editUser(id){
 const [uData,pData]=await Promise.all([api('/api/users'),api('/api/users/'+id+'/permissions')]);
 const u=uData.users.find(x=>x.id===id); if(!u)return;
 $('tm-user-id').value=u.id;$('tm-user-name').value=u.name;$('tm-user-email').value=u.email;
 $('tm-user-role').value=u.role;$('tm-user-active').value=String(u.active);$('tm-user-password').value='';
 renderPermissions(pData.permissions.filter(x=>x.allowed).map(x=>x.permission));
 $('tm-user-message').textContent='';
}
function newUser(){ $('tm-user-id').value='';$('tm-user-form').reset();$('tm-user-role').value='user';$('tm-user-active').value='true';renderPermissions([]);$('tm-user-message').textContent='';}
$('tm-user-new').onclick=newUser;$('tm-user-cancel').onclick=newUser;
$('tm-perm-all').onclick=()=>document.querySelectorAll('#tm-permissions-grid input').forEach(x=>x.checked=true);
$('tm-perm-none').onclick=()=>document.querySelectorAll('#tm-permissions-grid input').forEach(x=>x.checked=false);
$('tm-user-form').onsubmit=async e=>{
 e.preventDefault();try{
  const id=$('tm-user-id').value, body={name:$('tm-user-name').value,email:$('tm-user-email').value,role:$('tm-user-role').value,active:$('tm-user-active').value==='true'};
  if($('tm-user-password').value)body.password=$('tm-user-password').value;
  const u=id?(await api('/api/users/'+id,{method:'PATCH',body:JSON.stringify(body)})).user:(await api('/api/users',{method:'POST',body:JSON.stringify(body)})).user;
  const permissions=[...document.querySelectorAll('#tm-permissions-grid input:checked')].map(x=>x.dataset.perm);
  await api('/api/users/'+u.id+'/permissions',{method:'PUT',body:JSON.stringify({permissions})});
  $('tm-user-message').textContent='Usuario y permisos guardados correctamente.';await loadUsers();await editUser(u.id);
 }catch(err){$('tm-user-message').textContent=err.message}
};
window.TourManagerUsers={show:async()=>{$('tm-users-admin').style.display='block';await loadUsers();newUser()},hide:()=>{$('tm-users-admin').style.display='none'}};
})();
</script>

<script>
async function tmAuthInit(){
  const screen=document.getElementById('tm-auth-screen'), form=document.getElementById('tm-auth-form');
  async function req(url,opt){const r=await fetch(url,Object.assign({headers:{'Content-Type':'application/json'}},opt||{}));const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Error');return d}
  function show(setup){screen.style.display='flex';document.getElementById('tm-auth-title').textContent=setup?'Configuración inicial':'Tour Manager';document.getElementById('tm-auth-text').textContent=setup?'No hay usuarios. Crea el administrador inicial.':'Inicia sesión para continuar.';document.getElementById('tm-auth-name-wrap').style.display=setup?'block':'none';document.getElementById('tm-auth-name').required=setup;document.getElementById('tm-auth-submit').textContent=setup?'Crear administrador':'Entrar';}
  function hide(){screen.style.display='none'}
  try{
    const st=await req('/api/auth/status');
    if(st.authenticated){
      const p=await req('/api/auth/permissions'); TM_AUTH={user:st.user,permissions:p.permissions}; hide(); VIEWS=BASE_VIEWS.slice(); render(); return;
    }
    show(st.userCount===0);
    form.onsubmit=async e=>{e.preventDefault();document.getElementById('tm-auth-msg').textContent='';try{
      const setup=st.userCount===0; const body={email:document.getElementById('tm-auth-email').value,password:document.getElementById('tm-auth-password').value}; if(setup)body.name=document.getElementById('tm-auth-name').value;
      const d=await req(setup?'/api/auth/bootstrap':'/api/auth/login',{method:'POST',body:JSON.stringify(body)});
      const p=await req('/api/auth/permissions');TM_AUTH={user:d.user,permissions:p.permissions};hide();render();
    }catch(err){document.getElementById('tm-auth-msg').textContent=err.message;}};
  }catch(e){screen.style.display='flex';document.getElementById('tm-auth-msg').textContent='No fue posible conectar con el servidor.'}
}
async function tmLogout(){try{await fetch('/api/auth/logout',{method:'POST'});}finally{location.reload()}}
document.addEventListener('DOMContentLoaded',tmAuthInit);
</script>
</body>
