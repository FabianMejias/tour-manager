<style id="tm-modern-oc-ui">

/* ==========================================================
   MODERNIZACIÓN VISUAL — NUEVA / EDITAR OC
   No modifica IDs, datos ni lógica JavaScript.
   ========================================================== */

#modal .grid {
  display:grid !important;
  grid-template-columns:repeat(2,minmax(0,1fr)) !important;
  gap:18px !important;
  align-items:start !important;
}

/* Contenedor principal de la ventana */
#modal > div,
.modal {
  max-width:1280px;
}

/* Campos */
#modal .grid .field {
  min-width:0;
}

/* Inputs, selects y textarea */
#modal .grid input,
#modal .grid select,
#modal .grid textarea {
  width:100%;
  box-sizing:border-box;
}

/* ==========================================================
   AGRUPACIÓN VISUAL POR BLOQUES
   ========================================================== */

/* Cliente / cuenta + pasajero */
#modal .grid .field:nth-child(1),
#modal .grid .field:nth-child(2) {
  background:#f8fafc;
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:14px;
}

/* Tour / proveedor / vendedor */
#modal .grid .field:nth-child(3),
#modal .grid .field:nth-child(4),
#modal .grid .field:nth-child(5) {
  background:#f8fafc;
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:14px;
}

/* Fecha / hora */
#modal .grid .field:nth-child(6),
#modal .grid .field:nth-child(7),
#modal .grid .field:nth-child(8) {
  background:#f8fafc;
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:14px;
}

/* Pickup / Drop Off */
#modal .grid .field:nth-child(9),
#modal .grid .field:nth-child(10) {
  background:#f8fafc;
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:14px;
}

/* Costos */
#modal .grid .field:nth-child(11),
#modal .grid .field:nth-child(12),
#modal .grid .field:nth-child(13) {
  background:#f8fafc;
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:14px;
}

/* Observaciones ocupa todo el ancho */
#modal .grid .field.full,
#modal .grid textarea {
  grid-column:1 / -1;
}

/* ==========================================================
   ETIQUETAS
   ========================================================== */

#modal .grid .field label {
  display:block;
  margin-bottom:7px;
  font-weight:600;
  color:#526784;
  font-size:14px;
}

/* ==========================================================
   INPUTS
   ========================================================== */

#modal .grid input,
#modal .grid select,
#modal .grid textarea {
  border:1px solid #cbd5e1;
  border-radius:10px;
  background:#fff;
  min-height:42px;
  padding:9px 12px;
  font-size:15px;
  transition:border-color .15s ease, box-shadow .15s ease;
}

#modal .grid input:focus,
#modal .grid select:focus,
#modal .grid textarea:focus {
  outline:none;
  border-color:#0f766e;
  box-shadow:0 0 0 3px rgba(15,118,110,.10);
}

/* Observaciones */
#modal .grid textarea {
  min-height:90px;
  resize:vertical;
}

/* ==========================================================
   HORA
   ========================================================== */

#modal #ocHour,
#modal #ocMinute,
#modal #ocAmPm {
  min-height:42px;
}

#modal #ocMinute {
  width:80px !important;
}

#modal #ocAmPm {
  width:95px !important;
}

/* ==========================================================
   IVA
   ========================================================== */

#modal #ocTaxApply {
  width:20px;
  height:20px;
  accent-color:#0f766e;
  vertical-align:middle;
}

#modal #ocTaxApply + label {
  display:inline;
  margin-left:6px;
}

/* ==========================================================
   RESUMEN DE TOTALES
   ========================================================== */

#modal .oc-summary-modern {
  grid-column:1 / -1;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:0;
  margin-top:4px;
  border:1px solid #d7e4df;
  border-radius:14px;
  background:linear-gradient(135deg,#f3faf8,#f8fbfa);
  overflow:hidden;
}

#modal .oc-summary-modern .oc-total-item {
  padding:18px;
  text-align:center;
  border-right:1px solid #d7e4df;
}

#modal .oc-summary-modern .oc-total-item:last-child {
  border-right:0;
}

#modal .oc-summary-modern small {
  display:block;
  color:#64748b;
  font-size:13px;
  margin-bottom:5px;
}

#modal .oc-summary-modern strong {
  display:block;
  font-size:21px;
  color:#17324d;
}

#modal .oc-summary-modern .oc-grand-total strong {
  font-size:27px;
  color:#0f766e;
}

/* ==========================================================
   BOTONES
   ========================================================== */

#modal button {
  border-radius:10px;
}

#modal button.primary {
  background:#0f766e;
  border-color:#0f766e;
}

#modal button.primary:hover {
  filter:brightness(.95);
}

/* ==========================================================
   RESPONSIVE
   ========================================================== */

@media (max-width:900px) {

  #modal .grid {
    grid-template-columns:1fr !important;
  }

  #modal .grid .field.full,
  #modal .oc-summary-modern {
    grid-column:1;
  }

  #modal .oc-summary-modern {
    grid-template-columns:1fr;
  }

  #modal .oc-summary-modern .oc-total-item {
    border-right:0;
    border-bottom:1px solid #d7e4df;
  }

  #modal .oc-summary-modern .oc-total-item:last-child {
    border-bottom:0;
  }
}

</style>

<style>
/* ===== OC FIX DEFINITIVO CANTIDAD COSTO ===== */

/* La fila mantiene cada campo dentro de su propia columna */
.tm-oc-item{
  display:grid !important;
  grid-template-columns:
    minmax(260px, 1fr)
    90px
    160px
    120px

  column-gap:12px !important;
  align-items:center !important;

  padding:0 8px !important;

  text-align:center !important;

  font-variant-numeric:tabular-nums !important;

  position:relative !important;

  text-align:right !important;
  font-variant-numeric:tabular-nums !important;

  appearance:textfield !important;
  -moz-appearance:textfield !important;
}

.tm-oc-item input[type="number"]::-webkit-inner-spin-button,

 function parseDate(value){
   if(!value)return null;
   const raw=String(value).trim();
   const m=raw.match(/^(\d{4})-(\d{2})-(\d{2})/);
   if(m)return new Date(Number(m[1]),Number(m[2])-1,Number(m[3]));
   const d=new Date(raw);
   return Number.isNaN(d.getTime())?null:d;
 }

 function inRange(value,from,to){
   const d=parseDate(value);
   if(!d)return false;
   d.setHours(0,0,0,0);

 }

function tmOrderSearchText(v){
  return String(v||'')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'')
    .toLowerCase()
    .trim();
}

function tmOrderItems(o){

  return Array.isArray(o?.items)
    ? o.items.filter(Boolean)
    : [];

}


function tmOrderItemName(item){

  return (
    item?.tour ||
    item?.description ||
    db.tours.find(t=>t.id===item?.tourId)?.name ||
    ''
  );

}


function tmOrderServiceNames(o){

  const items=tmOrderItems(o);

  if(!items.length){
    return o?.tour||'';
  }

  return items
    .map(tmOrderItemName)
    .filter(Boolean)
    .join(' ');

}


function tmOrderServiceDisplay(o){

  const items=tmOrderItems(o);

  if(!items.length){
    return {
      title:o?.tour||'Sin servicio',
      detail:'',
      count:0
    };
  }

  const names=
    items
      .map(tmOrderItemName)
      .filter(Boolean);

  if(items.length===1){
    return {
      title:names[0]||'Servicio',
      detail:'',
      count:1
    };
  }

  return {
    title:`${items.length} servicios`,
    detail:names.join(' · '),
    count:items.length
  };

}


function tmOrderServiceLabel(o){

  const display=tmOrderServiceDisplay(o);

  if(display.count>1){
    return `${display.title}: ${display.detail}`;
  }

  return display.title||'Sin servicio';

}


function tmOrderPassengerTotal(o){

  const items=tmOrderItems(o);

  if(!items.length){
    return Number(o?.pax||0);
  }

  return items.reduce(
    (sum,item)=>
      sum + Number(item?.quantity||0),
    0
  );

}


function filterOrderRows(){

  const input=$('tmOrderSearch');
  const supplierSelect=$('tmOrderSupplier');
  const statusSelect=$('tmOrderStatus');
  const billingSelect=$('tmOrderBilling');

  const q=tmOrderSearchText(input?.value||'');
  const sf=supplierSelect?.value||'';
  const status=statusSelect?.value||'active';
  const billing=billingSelect?.value||'all';

  window.orderQ=input?.value||'';
  window.orderSupplier=sf;
  window.orderStatus=status;
  window.orderBilling=billing;

  let visible=0;

  document.querySelectorAll('.tm-oc-row').forEach(row=>{

    const rowStatus=row.dataset.status||'active';
    const rowBilling=row.dataset.billing||'pending';

    const searchOK=
      !q ||
      tmOrderSearchText(
        row.dataset.search||''
      ).includes(q);

    const supplierOK=
      !sf ||
      row.dataset.supplier===sf;

    const statusOK=
      status==='all' ||
      (
        status==='active' &&
        rowStatus!=='cancelled'
      ) ||
      (
        status==='cancelled' &&
        rowStatus==='cancelled'
      );

    const billingOK=
      billing==='all' ||
      rowBilling===billing;

    const show=
      searchOK &&
      supplierOK &&
      statusOK &&
      billingOK;

    row.style.display=show?'':'none';

    if(show)visible++;

  });

  const counter=$('tmOrderCounter');

  if(counter){
    counter.textContent=
      visible+' '+(visible===1?'orden':'órdenes');
  }

  const empty=$('tmOrderEmptyFiltered');

  if(empty){
    empty.style.display=
      visible ? 'none' : 'block';
  }

}

function cancelOrderForm(id){
  const o=db.orders.find(x=>x.id===id);

          <option value="Cliente canceló">Cliente canceló</option>

      </div>

      <div class="field" style="margin-top:14px">
        <label>Observación</label>

          id="tmCancelNotes"
          placeholder="Detalle adicional de la cancelación..."
          style="min-height:100px"></textarea>

        <button
          class="secondary"
          onclick="closeModal()">
          Volver
        </button>

        <button
          class="primary"
          style="background:#b42318"
          onclick="cancelOrder('${id}')">
          Confirmar cancelación
        </button>
      </div>

    </div>
    `
  );
}

async function cancelOrder(id){
  const reason=$('tmCancelReason')?.value||'';
  const notes=$('tmCancelNotes')?.value?.trim()||'';

  if(!reason){
    return alert('Debe seleccionar el motivo de cancelación.');
  }

  const btn=document.querySelector('.modal .primary');

  if(btn){
    btn.disabled=true;
    btn.textContent='Cancelando...';
  }

  try{

    const r=await fetch(
      '/api/purchase-orders/'+encodeURIComponent(id)+'/cancel',
      {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({reason,notes})
      }
    );

    const data=await r.json().catch(()=>({}));

    if(!r.ok){
      throw new Error(
        data.error||'No fue posible cancelar la OC.'
      );
    }

    db=await loadDB();

    closeModal();
    render();

    alert('OC cancelada correctamente.');

  }catch(e){

    if(btn){
      btn.disabled=false;
      btn.textContent='Confirmar cancelación';
    }

    alert(e.message);
  }
}

async function reactivateOrder(id){
  const o=db.orders.find(x=>x.id===id);

  if(!o)return;

  if(!confirm(
    '¿Desea reactivar la '+o.number+'?'
  ))return;

  try{

    const r=await fetch(
      '/api/purchase-orders/'+encodeURIComponent(id)+'/reactivate',
      {method:'POST'}
    );

    const data=await r.json().catch(()=>({}));

    if(!r.ok){
      throw new Error(
        data.error||'No fue posible reactivar la OC.'
      );
    }

    db=await loadDB();

    render();

    alert('OC reactivada correctamente.');

  }catch(e){
    alert(e.message);
  }
}

async function deleteOrder(id){
  const o=db.orders.find(x=>x.id===id);

  if(!o)return;

  if(!confirm(
    '¿Eliminar definitivamente '+o.number+'?\n\n'+
    'Esta acción no es una cancelación y eliminará la OC de forma permanente.\n\n'+
    'Para conservar el historial utilice Cancelar OC.'
  ))return;

  if(!confirm(
    'Última confirmación:\n\n'+
    '¿Está seguro de eliminar '+o.number+'?'
  ))return;

  try{

    const r=await fetch(
      '/api/purchase-orders/'+encodeURIComponent(id),
      {method:'DELETE'}
    );

    const data=await r.json().catch(()=>({}));

    if(!r.ok){
      throw new Error(
        data.error||'No fue posible eliminar la OC.'
      );
    }

    db.orders=db.orders.filter(x=>x.id!==id);

    render();

    alert(o.number+' eliminada.');

  }catch(e){
    alert(e.message);
  }
}

function displayDateTime(value){
 const raw=String(value||'').trim();
 if(!raw)return '-';

 const d=new Date(raw);

 if(Number.isNaN(d.getTime()))return raw;

 const date=
   String(d.getDate()).padStart(2,'0')+
   '/'+
   String(d.getMonth()+1).padStart(2,'0')+
   '/'+
   d.getFullYear();

 let h=d.getHours();
 const m=String(d.getMinutes()).padStart(2,'0');
 const ampm=h>=12?'PM':'AM';

 h=h%12;
 if(h===0)h=12;

 return date+
   ' · '+
   String(h).padStart(2,'0')+
   ':'+
   m+
   ' '+
   ampm;
}

function displayServiceDate(value){
 const raw=String(value||'').trim();
 if(!raw)return '-';

 const m=raw.match(/^(\d{4})-(\d{2})-(\d{2})/);
 if(m)return `${m[3]}/${m[2]}/${m[1]}`;

 const d=new Date(raw);
 if(!Number.isNaN(d.getTime())){
   return String(d.getDate()).padStart(2,'0')+'/'+
          String(d.getMonth()+1).padStart(2,'0')+'/'+
          d.getFullYear();
 }

 return raw;
}

function formatServiceTime(value){
 const raw=String(value||'').trim();
 if(!raw)return '-';

 const m=raw.match(/^(\d{1,2}):(\d{2})/);
 if(!m)return raw;

 let h=Number(m[1]);
 const min=m[2];

 if(Number.isNaN(h))return raw;

 const ampm=h>=12?'PM':'AM';
 h=h%12;
 if(h===0)h=12;

 return String(h).padStart(2,'0')+':'+min+' '+ampm;
}

function timeParts(value){
 const raw=String(value||'').trim();
 const m=raw.match(/^(\d{1,2}):(\d{2})/);

 if(!m){
   return {hour:'',minute:'',ampm:'AM'};
 }

 let h=Number(m[1]);
 const minute=m[2];

 if(h>=12){
   return {
     hour:String(h===12?12:h-12).padStart(2,'0'),
     minute,
     ampm:'PM'
   };
 }

 return {
   hour:String(h===0?12:h).padStart(2,'0'),
   minute,
   ampm:'AM'
 };
}


function normalizeOcTime(){
 const el=$('ocMinute');
 if(!el)return;

 let n=Number(el.value||0);

 if(Number.isNaN(n))n=0;
 n=Math.max(0,Math.min(59,Math.round(n)));

 el.value=String(n).padStart(2,'0');
}

function timeTo24(){
 const h=Number($('ocHour')?.value||0);
 normalizeOcTime(); const minute=String($('ocMinute')?.value||'00').padStart(2,'0');
 const ampm=$('ocAmPm')?.value||'AM';

 if(!h)return '';

 let hour=h%12;
 if(ampm==='PM')hour+=12;

 return String(hour).padStart(2,'0')+':'+minute;
}

function tmOrderTourSearch(input){

  const row=input.closest('[data-oc-item-row]');

  if(!row)return;

  const select=
    row.querySelector('.oc-item-tour');

  if(!select)return;

  const value=
    String(input.value||'')
      .trim()
      .toLowerCase();

  const tour=db.tours.find(
    t=>
      String(t.name||'')
        .trim()
        .toLowerCase()===value
  );

  if(tour){

    select.value=tour.id;

    input.value=tour.name;

    input.classList.remove(
      'tm-tour-search-invalid'
    );

    orderItemCostFromTour(select);

  }else{

    select.value='';

    input.classList.toggle(
      'tm-tour-search-invalid',
      Boolean(value)
    );
  }

  orderCalc();
}


function tmOrderTourSearchBlur(input){

  const row=input.closest('[data-oc-item-row]');

  if(!row)return;

  const select=
    row.querySelector('.oc-item-tour');

  if(!select)return;

  const typed=
    String(input.value||'')
      .trim()
      .toLowerCase();

  if(!typed){
    select.value='';
    return;
  }

  const exact=db.tours.find(
    t=>
      String(t.name||'')
        .trim()
        .toLowerCase()===typed
  );

  if(exact){
    input.value=exact.name;
    select.value=exact.id;
    input.classList.remove('tm-tour-search-invalid');
    orderItemCostFromTour(select);
    return;
  }

  const matches=db.tours.filter(
    t=>
      String(t.name||'')
        .toLowerCase()
        .includes(typed)
  );

  // Si lo digitado identifica únicamente un tour,
  // lo seleccionamos automáticamente.
  if(matches.length===1){

    const tour=matches[0];

    input.value=tour.name;
    select.value=tour.id;

    input.classList.remove(
      'tm-tour-search-invalid'
    );

    orderItemCostFromTour(select);

  }else{

    select.value='';

    input.classList.add(
      'tm-tour-search-invalid'
    );
  }

  orderCalc();
}

async function orderItemCostFromTour(el){

  const row=
    el?.closest(
      '[data-oc-item-row]'
    );

  if(!row)return;

  const tourId=
    row.querySelector(
      '.oc-item-tour'
    )?.value||'';

  const serviceDate=
    $('ocService')?.value||'';

  const costInput=
    row.querySelector(
      '.oc-item-cost'
    );

  const info=
    row.querySelector(
      '.oc-item-rate-info'
    );

  const t=
    db.tours.find(
      x=>x.id===tourId
    );

  if(!tourId||!costInput){
    orderCalc();
    return;
  }

  if(!serviceDate){

    costInput.value=
      Number(
        t?.cost||0
      ).toFixed(2);

    if(info){
      info.innerHTML=
        '<span style="color:#64748b">' +
        'Seleccione la fecha para validar tarifa.' +
        '</span>';
    }

    orderCalc();
    return;
  }

  try{

    const response=
      await fetch(
        '/api/tour-rates/' +
        encodeURIComponent(tourId)
      );

    const data=
      await response
        .json()
        .catch(()=>({}));

    if(!response.ok){
      throw new Error(
        data.error ||
        'No fue posible consultar las tarifas.'
      );
    }

    const rates=data.rates||[];

    const rate=rates
      .filter(r=>
        r.active &&
        String(r.validFrom||'')
          .slice(0,10)<=serviceDate &&
        String(r.validTo||'')
          .slice(0,10)>=serviceDate
      )
      .sort((a,b)=>
        String(b.validFrom||'')
          .localeCompare(
            String(a.validFrom||'')
          )
      )[0];

    if(rate){

      costInput.value=
        Number(
          rate.cost||0
        ).toFixed(2);

      if(info){
        info.innerHTML=
          '<span style="color:#14877f;font-weight:700">' +
          '✓ Tarifa aplicada</span> ' +
          rateDate(rate.validFrom) +
          ' al ' +
          rateDate(rate.validTo);
      }

    }else{

      if(info){
        info.innerHTML=
          '<span style="color:#b45309;font-weight:700">' +
          '⚠ Sin tarifa configurada</span>';
      }

      if(!costInput.value){
        costInput.value=
          Number(
            t?.cost||0
          ).toFixed(2);
      }
    }

  }catch(e){

    if(info){
      info.innerHTML=
        '<span style="color:#b91c1c;font-weight:700">' +
        'No se pudo consultar la tarifa.' +
        '</span>';
    }
  }

  orderCalc();
}


async function orderCostFromTour(){

  // OC histórica:
  // nunca sustituir automáticamente su costo.
  if(window.tmLegacyOrderEdit===true){
    orderCalc();
    return;
  }

  const selects=[
    ...document.querySelectorAll(
      '#ocItems .oc-item-tour'
    )
  ];

  for(const select of selects){
    await orderItemCostFromTour(select);
  }

  orderCalc();
}


function orderCalc(){

  // Edición histórica.
  if(window.tmLegacyOrderEdit===true){

    const base=
      (+$('ocPax')?.value||0) *
      (+$('ocCost')?.value||0);

    const x=calc(
      base,
      $('ocTaxApply')?.checked!==false
    );

    if($('ocSub')){
      $('ocSub').textContent=
        money(x.subtotal);
    }

    if($('ocTax')){
      $('ocTax').textContent=
        money(x.tax);
    }

    if($('ocTotal')){
      $('ocTotal').textContent=
        money(x.total);
    }

    return;
  }

  let subtotal=0;

  const rows=[
    ...document.querySelectorAll(
      '#ocItems [data-oc-item-row]'
    )
  ];

  for(const row of rows){

    const qty=
      Number(
        row.querySelector(
          '.oc-item-qty'
        )?.value||0
      );

    const cost=
      Number(
        row.querySelector(
          '.oc-item-cost'
        )?.value||0
      );

    const lineSubtotal=
      qty*cost;

    subtotal+=lineSubtotal;

    const totalEl=
      row.querySelector(
        '.oc-item-total'
      );

    if(totalEl){
      totalEl.textContent=
        money(lineSubtotal);
    }
  }

  const x=calc(
    subtotal,
    $('ocTaxApply')?.checked!==false
  );

  if($('ocSub')){
    $('ocSub').textContent=
      money(x.subtotal);
  }

  if($('ocTax')){
    $('ocTax').textContent=
      money(x.tax);
  }

  if($('ocTotal')){
    $('ocTotal').textContent=
      money(x.total);
  }
}

    ){
      alert(
        'La cantidad de cada servicio debe ser mayor que cero.'
      );
      return;
    }

    if(
      !Number.isFinite(unitCost) ||
      unitCost<0
    ){
      alert(
        'El costo de cada servicio no es válido.'
      );
      return;
    }

    const itemId=
      row.dataset.itemId||'';

    items.push({
      ...(itemId ? {id:itemId} : {}),
      tourId:t.id,
      description:t.name,
      quantity,
      unitCost
    });
  }

  const subtotal=
    items.reduce(
      (sum,item)=>
        sum +
        item.quantity *
        item.unitCost,
      0
    );

  const x=calc(
    subtotal,
    applyTax
  );

  const firstTour=
    db.tours.find(
      t=>t.id===items[0].tourId
    );

  return {
    clientId:c.id,
    client:c.name,
    customerName:passenger,

    // Campos legacy para compatibilidad.
    tourId:items[0].tourId,
    tour:firstTour?.name||'',
    pax:items.reduce(
      (sum,item)=>
        sum+item.quantity,
      0
    ),
    unitCost:items[0].unitCost,

    items,

    supplierId,
    sellerId,
    seller:seller(sellerId),
    issueDate:$('ocIssue').value,
    serviceDate:service,
    time:timeTo24(),
    place:$('ocPlace').value,
    dropOff:$('ocDropOff').value,
    subtotal:x.subtotal,
    taxRate:applyTax?13:0,
    tax:x.tax,
    total:x.total,
    currency:$('ocCurrency').value,
    notes:$('ocNotes').value
  };
}

async function saveOrder(id){

 const d=orderData();

 if(!o||!d)return;

 const btn=document.querySelector('.modal .primary');
 if(btn){btn.disabled=true;btn.textContent='Guardando...';}

 try{
   const r=await fetch('/api/purchase-orders/'+encodeURIComponent(id),{
     method:'PUT',
     headers:{'Content-Type':'application/json'},
     body:JSON.stringify({
       ...d,
       updatedAt:o.updatedAt
     })
   });

   const data=await r.json();

     saleId:x.sale_id,
     updatedAt:x.updated_at,

   });


   if(Array.isArray(data.items)){

         db.tours.find(t=>t.id===item.tourId)?.name ||

       tax:Number(item.taxAmount||0),
       total:Number(item.total||0),
       position:Number(item.position||0)
     }));
   }

   closeModal();
   alert('OC '+o.number+' actualizada.');

   view='orders';
   render();

 }catch(e){

 }finally{
   if(btn){btn.disabled=false;btn.textContent='Guardar OC';}
 }
}

function renderPayments(){

 const sf=$('paySupplier')?.value||'';
 const q=($('paySearch')?.value||'').trim().toLowerCase();

 const from=$('payDateFrom')?.value||'';
 const to=$('payDateTo')?.value||'';

 /*
  * ==========================================================
  * CxP
  *
  * IMPORTANTE:
  * El filtro utiliza serviceDate.
  * NO utiliza fecha de creación de la OC.
  * NO utiliza fecha de pago.
  * ==========================================================
  */

 if(from && to && from>to){

   $('pendingPayments').innerHTML=`
     <div class="notice">
       <b>Rango de fechas inválido.</b><br>
       La fecha desde no puede ser posterior a la fecha hasta.
     </div>
   `;

 } else {

   const rows=db.orders
     .filter(o=>{

       // Solo pendientes
       if(o.paymentStatus==='Pagado')return false;

       // Filtro proveedor
       if(sf && o.supplierId!==sf)return false;

       // Fecha real del servicio
       const service=String(
         dateOnly(o.serviceDate)||''
       ).slice(0,10);

       if(from && service<from)return false;
       if(to && service>to)return false;

       // Búsqueda
       if(q){

         const text=[
           o.number,
           o.op,
           o.customerName,
           tmOrderServiceNames(o),
           supplier(o.supplierId)
         ]
         .join(' ')
         .toLowerCase();

         if(!text.includes(q))return false;
       }

       return true;

     })
     .sort((a,b)=>{

       const da=String(
         dateOnly(a.serviceDate)||''
       );

       const dbb=String(
         dateOnly(b.serviceDate)||''
       );

       return da.localeCompare(dbb)
         || a.number.localeCompare(b.number);

     });


   /*
    * Agrupar por proveedor
    */

   const supplierGroups={};

   rows.forEach(o=>{

     const sid=o.supplierId||'sin-proveedor';

     if(!supplierGroups[sid]){

       supplierGroups[sid]={
         supplierId:o.supplierId,
         name:supplier(o.supplierId),
         orders:[],
         total:0
       };

     }

     supplierGroups[sid].orders.push(o);

     supplierGroups[sid].total+=Number(
       o.total||0
     );

   });


   const groups=Object.values(
     supplierGroups
   );

   const grandTotal=rows.reduce(
     (a,o)=>a+Number(o.total||0),
     0
   );


   /*
    * Resumen CxP
    */

   const summary=`

     <div style="
       display:grid;
       grid-template-columns:
         repeat(3,minmax(0,1fr));
       gap:12px;
       margin-bottom:18px;

           font-weight:700;
           margin-top:5px;

       </div>


       <div style="
         padding:16px;
         border:1px solid #e2e8ee;
         border-radius:14px;
         background:#f8fafc;
       ">
         <small style="color:#64748b">
           Servicios pendientes
         </small>

         <div style="
           font-size:24px;
           font-weight:700;
           margin-top:5px;
         ">
           ${rows.length}
         </div>
       </div>


       <div style="
         padding:16px;
         border:1px solid #e2e8ee;
         border-radius:14px;
         background:#f8fafc;
       ">
         <small style="color:#64748b">
           Total CxP
         </small>

         <div style="
           font-size:24px;
           font-weight:700;
           margin-top:5px;
         ">
           ${money(grandTotal)}
         </div>
       </div>

     </div>

   `;


   const rangeText=
     from||to

       ? `<div style="
            margin-bottom:14px;
            color:#64748b;
            font-size:13px;
          ">
            Servicios desde
            <b>
              ${from
                ? displayServiceDate(from)
                : 'el inicio'}
            </b>
            hasta
            <b>
              ${to
                ? displayServiceDate(to)
                : 'el final'}
            </b>
          </div>`

       : `<div style="
            margin-bottom:14px;
            color:#64748b;
            font-size:13px;
          ">
            Mostrando todas las OCs pendientes de pago.
          </div>`;


   /*
    * Proveedores
    */

   const groupedHtml=groups.map(g=>`

     <div style="
       border:1px solid #e2e8ee;
       border-radius:15px;
       overflow:hidden;
       margin-bottom:16px;
       background:#fff;
     ">

       <div style="
         display:flex;
         justify-content:space-between;
         align-items:center;
         gap:15px;
         padding:15px 18px;
         background:#f8fafc;
         border-bottom:1px solid #e2e8ee;
       ">

         <div>

           <strong style="font-size:16px">
             ${esc(g.name)}
           </strong>

           <div style="
             font-size:12px;
             color:#64748b;
             margin-top:3px;
           ">
             ${g.orders.length}
             servicio(s) pendiente(s)
           </div>

         </div>

           ${money(g.total)}
         </strong>

       </div>


       <div style="overflow-x:auto">

         <table style="margin:0">

           <tr>

             <th>
               <input
                 type="checkbox"
                 onchange="
                   document
                     .querySelectorAll(
                       '.payGroup-${esc(g.supplierId||'none')}'
                     )
                     .forEach(x=>x.checked=this.checked)
                 ">
             </th>

             <th>OC</th>
             <th>Cliente</th>
             <th>Tour</th>
             <th>Fecha servicio</th>
             <th>Total</th>

           </tr>


           ${g.orders.map(o=>`

                 ${esc(tmOrderServiceLabel(o))}
               </td>


               <td>

                 ${displayServiceDate(o.serviceDate)}

                 ${
                   o.time

         </table>

   $('pendingPayments').innerHTML=rows.length

          </b>

        </div>`;

  * NO se modifica la estructura de los pagos.
  * Se mantiene Vista previa.
  * ==========================================================
  */

 const hf=$('historySupplier')?.value||'';

 const hq=(
   $('historySearch')?.value||''
 )
 .trim()
 .toLowerCase();


 const ps=db.payments
   .filter(p=>

     (!hf||p.supplierId===hf)

     &&

     (
       !hq
       ||
       [
         p.number,
         p.receipt,
         supplier(p.supplierId),

         ...(p.orderIds||[])
           .map(
             i=>db.orders.find(
               o=>o.id===i
             )?.number||''
           )

       ]
       .join(' ')
       .toLowerCase()
       .includes(hq)
     )

   )

 $('paymentHistory').innerHTML=ps.length

function payOpenForm(){
 const os=selectedOrders();if(!os.length)return alert('Seleccione al menos una OC para pagar.');
 const ss=[...new Set(os.map(o=>o.supplierId))];if(ss.length!==1)return alert('Seleccione OCs de un solo proveedor.');

 pendingPaymentOrderIds=os.map(o=>o.id);
 modal('Registrar pago',`<div class="notice"><b>${os.length}</b> OC(s) · Proveedor: <b>${esc(supplier(ss[0]))}</b> · Total: <b>${money(total)}</b></div>

 <div class="actions"><button id="cancelPayment" class="secondary">Cancelar</button><button id="applyPaymentBtn" class="primary">Aplicar pago</button></div>`);
 $('cancelPayment').addEventListener('click',closeModal);
 $('applyPaymentBtn').addEventListener('click',applyPayment);
}
function applyPayment(){
 const ids=[...pendingPaymentOrderIds];
 if(!ids.length)return alert('No hay OCs seleccionadas para este pago.');
 const date=$('paymentDate').value,receipt=$('paymentReceipt').value.trim();if(!date||!receipt)return alert('Complete fecha y número de comprobante.');
 const os=ids.map(i=>db.orders.find(o=>o.id===i)).filter(Boolean),ss=[...new Set(os.map(o=>o.supplierId))];
 if(!os.length||ss.length!==1)return alert('Selección de pago inválida.');
 if(os.some(o=>o.paymentStatus==='Pagado'))return alert('Una OC seleccionada ya está pagada. Actualice la pantalla.');
 const p={id:uid(),number:next('P'),supplierId:ss[0],date,receipt,total:os.reduce((a,o)=>a+Number(o.total||0),0),orderIds:os.map(o=>o.id)};
 db.payments.push(p);os.forEach(o=>{o.paymentStatus='Pagado';o.paymentDate=date;o.paymentReceipt=receipt;o.paymentId=p.id});
 pendingPaymentOrderIds=[];
 saveDB();closeModal();alert('Pago '+p.number+' aplicado correctamente.');
}

function tmSaleServiceLabel(s){

  if(
    Array.isArray(s?.items) &&
    s.items.length
  ){

    const names=s.items
      .map(
        item=>
          item.description ||
          item.tour ||
          ''
      )
      .filter(Boolean);

    if(s.items.length===1){
      return names[0] || '1 servicio';
    }

    return (
      s.items.length+
      ' servicios · '+
      names.join(', ')
    );
  }

  return s?.tour || '';
}


function tmSalePassengerLabel(s){

  if(
    Array.isArray(s?.items) &&
    s.items.length
  ){
    return s.items.reduce(
      (sum,item)=>
        sum+
        Number(item.quantity||0),
      0
    );
  }

  return Number(s?.pax||0);
}

function tmSaleSourceItems(order){

  if(
    Array.isArray(order?.items) &&
    order.items.length
  ){
    return order.items.map((item,index)=>{

      const tour=db.tours.find(
        x=>x.id===item.tourId
      );

      return {
        sourceItemId:item.id||null,
        tourId:item.tourId||null,
        description:
          item.description ||
          item.tour ||
          tour?.name ||
          'Servicio',
        quantity:Number(item.quantity||1),
        unitPrice:Number(tour?.hotel||0),
        position:index
      };
    });
  }

  const tour=db.tours.find(
    x=>x.id===order?.tourId
  );

  return [{
    sourceItemId:null,
    tourId:order?.tourId||null,
    description:
      order?.tour ||
      tour?.name ||
      'Servicio',
    quantity:Number(order?.pax||1),
    unitPrice:Number(tour?.hotel||0),
    position:0
  }];
}

function saleCalc(){

  const items=tmSaleReadItems();

  let subtotal=0;

  document
    .querySelectorAll('.tm-sale-item-row')
    .forEach((row,index)=>{

      const item=items[index];

      const lineTotal=
        Number(item?.quantity||0) *
        Number(item?.unitPrice||0);

      subtotal+=lineTotal;

      const target=
        row.querySelector(
          '.tm-sale-item-total'
        );

      if(target){
        target.textContent=
          money(lineTotal);
      }
    });

  const dp=
    Number(
      $('saleDiscount')?.value ||
      0
    );

  const discount=
    subtotal *
    dp /
    100;

  const applyTax=
    $('saleTaxApply')?.checked!==false;

  const x=
    calc(
      subtotal-discount,
      applyTax
    );

  if($('saleSub')){
    $('saleSub').textContent=
      money(subtotal);
  }

  if($('saleDiscountAmount')){
    $('saleDiscountAmount').textContent=
      '-'+money(discount);
  }

  if($('saleTax')){
    $('saleTax').textContent=
      applyTax
        ?money(x.tax)
        :'No aplica';
  }

  if($('saleTotal')){
    $('saleTotal').textContent=
      money(x.total);
  }
}


async function createSale(orderId){

  const o=db.orders.find(
    x=>x.id===orderId
  );

  if(!o)return;

  if((o.status||'active')==='cancelled'){
    return alert(
      'Esta OC está cancelada. Debe reactivarla antes de generar una factura.'
    );
  }

  if(o.saleId){
    return alert(
      'Esta OC ya tiene factura.'
    );
  }

  const items=tmSaleReadItems();

  if(!items.length){
    return alert(
      'La factura debe contener al menos un servicio.'
    );
  }

  for(const item of items){

    if(!(Number(item.quantity)>0)){
      return alert(
        'La cantidad de cada servicio debe ser mayor que cero.'
      );
    }

    if(!(Number(item.unitPrice)>0)){
      return alert(
        'Ingrese el precio de venta de todos los servicios.'
      );
    }
  }

  const dp=
    Number(
      $('saleDiscount')?.value ||
      0
    );

  if(dp<0 || dp>100){
    return alert(
      'El descuento debe estar entre 0% y 100%.'
    );
  }

  const paymentMethod=
    $('salePaymentMethod')?.value ||
    '';

  if(!paymentMethod){
    return alert(
      'Seleccione el medio de pago.'
    );
  }

  const subtotal=
    items.reduce(
      (sum,item)=>
        sum+
        Number(item.quantity||0) *
        Number(item.unitPrice||0),
      0
    );

  const discount=
    subtotal *
    dp /
    100;

  const applyTax=
    $('saleTaxApply')?.checked!==false;

  const x=
    calc(
      subtotal-discount,
      applyTax
    );

  const first=
    items[0];

  const totalPax=
    items.reduce(
      (sum,item)=>
        sum+
        Number(item.quantity||0),
      0
    );

  const s={
    id:uid(),
    number:next('V'),
    op:o.op,
    orderId:o.id,
    clientId:o.clientId,
    customerName:o.customerName,

    // Compatibilidad histórica:
    tourId:first.tourId||o.tourId||null,
    tour:first.description||o.tour||'',
    pax:totalPax,
    unitPrice:Number(first.unitPrice||0),

    sellerId:o.sellerId,
    seller:o.seller,
    serviceDate:o.serviceDate,

    discount:dp,
    subtotal,
    discountAmount:discount,
    taxableAmount:subtotal-discount,
    taxRate:applyTax?13:0,
    tax:x.tax,
    total:x.total,
    currency:o.currency,
    paymentMethod,

    // Nueva estructura multi-servicio.
    items:items.map((item,index)=>({
      id:uid(),
      tourId:item.tourId||null,
      tour:item.description||'',
      description:item.description||'',
      quantity:Number(item.quantity||0),
      unitPrice:Number(item.unitPrice||0),
      subtotal:
        Number(item.quantity||0) *
        Number(item.unitPrice||0),
      position:index
    }))
  };

  const previousSaleId=o.saleId||null;

  db.sales.push(s);
  o.saleId=s.id;

  try{

    await saveDB();

    closeModal();

    alert(
      'Factura '+s.number+' creada.'
    );

  }catch(e){

    db.sales=
      db.sales.filter(
        x=>x.id!==s.id
      );

    o.saleId=previousSaleId;

    console.error(e);

    alert(
      'No se pudo crear la factura: '+
      (e?.message||'Error desconocido')
    );
  }
}

  const saleId=
    $('saleEditDiscount')?.dataset?.saleId ||

    x=>x.id===saleId
  );

  if(!s)return;

  const hasItems=
    Array.isArray(s.items) &&
    s.items.length>0;

  let subtotal=0;


  if(hasItems){

    const items=tmSaleEditReadItems();

    document
      .querySelectorAll('.tm-sale-edit-item-row')
      .forEach((row,index)=>{

        const item=items[index];

        const lineTotal=
          Number(item?.quantity||0) *
          Number(item?.unitPrice||0);

        subtotal+=lineTotal;

        const target=
          row.querySelector(
            '.tm-sale-edit-item-total'
          );

        if(target){
          target.textContent=
            money(lineTotal);
        }
      });

  }else{

    const price=
      Number(
        $('saleEditPrice')?.value ||
        0
      );

    const order=db.orders.find(
      x=>x.id===s.orderId
    );

    const pax=
      Number(
        order?.pax ||
        s.pax ||
        1
      );

    subtotal=
      pax *
      price;
  }


  const dp=
    Number(
      $('saleEditDiscount')?.value ||
      0
    );

  const discount=
    subtotal *
    dp /
    100;

  const applyTax=
    $('saleEditTaxApply')?.checked!==false;

  const x=
    calc(
      subtotal-discount,
      applyTax
    );


  if($('saleEditSub')){
    $('saleEditSub').textContent=
      money(subtotal);
  }

  if($('saleEditDiscountAmount')){
    $('saleEditDiscountAmount').textContent=
      '-'+money(discount);
  }

  if($('saleEditTax')){
    $('saleEditTax').textContent=
      applyTax
        ?money(x.tax)
        :'No aplica';
  }

  if($('saleEditTotal')){
    $('saleEditTotal').textContent=
      money(x.total);
  }
}


async function saveSaleEdit(id){

  const s=db.sales.find(
    x=>x.id===id
  );

  if(!s)return;

  const original=
    JSON.parse(
      JSON.stringify(s)
    );

  const hasItems=
    Array.isArray(s.items) &&
    s.items.length>0;

  const dp=
    Number(
      $('saleEditDiscount')?.value ||
      0
    );

  if(dp<0 || dp>100){
    return alert(
      'El descuento debe estar entre 0% y 100%.'
    );
  }

  const paymentMethod=
    $('saleEditPaymentMethod')?.value ||
    '';

  const applyTax=
    $('saleEditTaxApply')?.checked!==false;


  if(hasItems){

    const items=
      tmSaleEditReadItems();

    if(!items.length){
      return alert(
        'La factura debe contener al menos un servicio.'
      );
    }

    for(const item of items){

      if(!(Number(item.quantity)>0)){
        return alert(
          'La cantidad de cada servicio debe ser mayor que cero.'
        );
      }

      if(!(Number(item.unitPrice)>0)){
        return alert(
          'Ingrese el precio de venta de todos los servicios.'
        );
      }
    }

    const subtotal=
      items.reduce(
        (sum,item)=>
          sum+
          Number(item.quantity||0) *
          Number(item.unitPrice||0),
        0
      );

    const discount=
      subtotal *
      dp /
      100;

    const x=
      calc(
        subtotal-discount,
        applyTax
      );

    const first=items[0];

    const totalPax=
      items.reduce(
        (sum,item)=>
          sum+
          Number(item.quantity||0),
        0
      );

    Object.assign(
      s,
      {
        tourId:
          first.tourId ||
          s.tourId ||
          null,

        tour:
          first.description ||
          s.tour ||
          '',

        pax:totalPax,

        unitPrice:
          Number(
            first.unitPrice ||
            0
          ),

        discount:dp,
        subtotal,
        discountAmount:discount,
        taxableAmount:subtotal-discount,
        taxRate:applyTax?13:0,
        tax:x.tax,
        total:x.total,
        paymentMethod,

        items:items.map(
          (item,index)=>({
            id:item.id,
            tourId:item.tourId||null,
            tour:item.description||'',
            description:item.description||'',
            quantity:Number(item.quantity||0),
            unitPrice:Number(item.unitPrice||0),
            subtotal:
              Number(item.quantity||0) *
              Number(item.unitPrice||0),
            position:index
          })
        )
      }
    );

  }else{

    const price=
      Number(
        $('saleEditPrice')?.value ||
        0
      );

    if(price<=0){
      return alert(
        'Ingrese el precio de venta.'
      );
    }

    const subtotal=
      Number(s.pax||1) *
      price;

    const discount=
      subtotal *
      dp /
      100;

    const x=
      calc(
        subtotal-discount,
        applyTax
      );

    Object.assign(
      s,
      {
        unitPrice:price,
        discount:dp,
        subtotal,
        discountAmount:discount,
        taxableAmount:subtotal-discount,
        taxRate:applyTax?13:0,
        tax:x.tax,
        total:x.total,
        paymentMethod
      }
    );
  }


  try{

    await saveDB();

    closeModal();

    alert(
      'Factura '+s.number+' actualizada.'
    );

  }catch(e){

    const index=
      db.sales.findIndex(
        x=>x.id===id
      );

    if(index>=0){
      db.sales[index]=original;
    }

    console.error(e);

    alert(
      'No se pudo actualizar la factura: '+
      (e?.message||'Error desconocido')
    );
  }
}

function reportTab(which){
  document.querySelectorAll('.report').forEach(x=>x.style.display='none');

  const panels={
    future:'repFuture',
    seller:'repSeller',
    analysis:'repAnalysis'
  };

  const buttons={
    future:'reportBtnFuture',
    seller:'reportBtnSeller',
    analysis:'reportBtnAnalysis'
  };

  if($(panels[which]))$(panels[which]).style.display='block';

  Object.entries(buttons).forEach(([key,id])=>{
    const btn=$(id);
    if(!btn)return;
    btn.classList.remove('primary','secondary');
    btn.classList.add(key===which?'primary':'secondary');
  });

  renderReports();
}

function reportSaleForOrder(o){
  if(!o)return null;

  if(o.saleId){
    const byId=db.sales.find(s=>s.id===o.saleId);
    if(byId)return byId;
  }

  return db.sales.find(s=>s.orderId===o.id)||null;
}

function reportRows(){

  const f=$('rFutureFrom')?.value||'';
  const t=$('rFutureTo')?.value||'';
  const status=$('rFutureStatus')?.value||'';
  const sellerId=$('rFutureSeller')?.value||'';
  const supplierId=$('rFutureSupplier')?.value||'';
  const tourId=$('rFutureTour')?.value||'';
  const orderStatus=$('rFutureOrderStatus')?.value||'active';

  return db.orders.filter(o=>{

    const d=dateOnly(o.serviceDate);
    const ocStatus=o.status||'active';
    const cancelled=ocStatus==='cancelled';
    const sale=reportSaleForOrder(o);
    const paid=!!sale;

    const orderStatusMatch=
      orderStatus==='all' ||
      ocStatus===orderStatus;

    const paymentMatch=
      !status ||
      (status==='paid' && paid && !cancelled) ||
      (status==='pending' && !paid && !cancelled);

    return (!f||d>=f)
      &&(!t||d<=t)
      &&orderStatusMatch
      &&paymentMatch
      &&(!sellerId||o.sellerId===sellerId)
      &&(!supplierId||o.supplierId===supplierId)
      &&(
        !tourId ||
        (
          tmOrderItems(o).length
            ? tmOrderItems(o).some(
                item=>item.tourId===tourId
              )
            : o.tourId===tourId
        )
      );

  }).sort((a,b)=>
    (dateOnly(a.serviceDate)+(a.time||'')).localeCompare(
      dateOnly(b.serviceDate)+(b.time||'')
    )
  );

}

    const visibleItems=

      total:Number(item.total||0)
    }));

  });

}

function sellerReportRows(){

  const f=$('rSellerFrom')?.value||'';
  const t=$('rSellerTo')?.value||'';
  const sv=$('rSeller')?.value||'';
  const sort=$('rSellerSort')?.value||'serviceDate';
  const direction=$('rSellerDirection')?.value||'asc';

  const rows=db.sales
    .map(s=>{

      const o=db.orders.find(x=>x.id===s.orderId);

      const cost=Number(o?.subtotal||0);
      const sale=
        Number(s.subtotal||0)-
        Number(s.discountAmount||0);

      const margin=sale-cost;

      const rate=Number(
        db.sellers.find(
          x=>x.id===s.sellerId
        )?.commissionRate||0
      );

      const commission=
        Math.max(0,margin)*rate/100;

      return {
        s,
        o,
        cost,
        sale,
        margin,
        rate,
        commission
      };

    })
    .filter(r=>{

      const d=dateOnly(r.s.serviceDate);

      const activeOrder=
        !r.o ||
        (r.o.status||'active')!=='cancelled';

      return activeOrder
        &&(!f||d>=f)
        &&(!t||d<=t)
        &&(!sv||r.s.sellerId===sv);

    });

  const compare=(a,b)=>{

    let av='',bv='';

    if(sort==='oc'){

      const an=Number(
        String(a.o?.number||'').replace(/\D/g,'')
      )||0;

      const bn=Number(
        String(b.o?.number||'').replace(/\D/g,'')
      )||0;

      if(an!==bn){
        return direction==='asc'
          ?an-bn
          :bn-an;
      }

      av=String(a.o?.number||'');
      bv=String(b.o?.number||'');

    }else if(sort==='seller'){

      av=String(a.s.seller||'').toLowerCase();
      bv=String(b.s.seller||'').toLowerCase();

    }else if(sort==='client'){

      av=String(a.s.customerName||'').toLowerCase();
      bv=String(b.s.customerName||'').toLowerCase();

    }else{

      av=
        dateOnly(a.s.serviceDate)+
        (a.o?.time||'');

      bv=
        dateOnly(b.s.serviceDate)+
        (b.o?.time||'');

    }

    const result=av.localeCompare(
      bv,
      undefined,
      {
        numeric:true,
        sensitivity:'base'
      }
    );

    return direction==='asc'
      ?result
      :-result;

  };

  return rows.sort(compare);

}

function analysisReportData(
  from,
  to,
  group,
  direction,
  limit
){

  const orders=db.orders.filter(o=>{

    const d=dateOnly(o.serviceDate);

    return (o.status||'active')!=='cancelled'
      &&(!from||d>=from)
      &&(!to||d<=to);

  });

  const map={};


  orders.forEach(o=>{

    const items=tmOrderItems(o);

    const serviceRows=
      items.length
        ? items.map(item=>({
            tour:tmOrderItemName(item)||'Servicio',
            pax:Number(item.quantity||0),
            cost:Number(item.subtotal||0)
          }))
        : [{
            tour:o.tour||'',
            pax:Number(o.pax||0),
            cost:Number(o.subtotal||0)
          }];

    const sale=reportSaleForOrder(o);

    const saleAmount=
      sale
        ? Number(sale.subtotal||0)-
          Number(sale.discountAmount||0)
        : 0;


    // --------------------------------------------------------
    // AGRUPAR POR TOUR
    //
    // Cada línea real es un servicio independiente.
    // Una venta solo puede atribuirse directamente al tour
    // cuando la OC tiene un único servicio.
    //
    // Las OCs multi-servicio todavía no son facturables,
    // por lo que no inventamos distribución de ventas.
    // --------------------------------------------------------

    if(group==='tour'){

      serviceRows.forEach(row=>{

        const key=row.tour||'Sin servicio';

        if(!map[key]){
          map[key]={
            name:key,
            services:0,
            pax:0,
            sales:0,
            cost:0
          };
        }

        map[key].services++;
        map[key].pax+=row.pax;
        map[key].cost+=row.cost;

        if(serviceRows.length===1){
          map[key].sales+=saleAmount;
        }

      });

      return;
    }


    // --------------------------------------------------------
    // PROVEEDOR / VENDEDOR / CLIENTE
    //
    // Servicios, pasajeros y costos se suman por líneas.
    // La venta de la OC se suma UNA SOLA VEZ.
    // --------------------------------------------------------

    const key=
      group==='supplier'
        ? supplier(o.supplierId)
        : group==='seller'
          ? o.seller
          : o.client;

    const safeKey=key||'Sin información';

    if(!map[safeKey]){
      map[safeKey]={
        name:safeKey,
        services:0,
        pax:0,
        sales:0,
        cost:0
      };
    }

    map[safeKey].services+=serviceRows.length;

    map[safeKey].pax+=serviceRows.reduce(
      (sum,row)=>sum+row.pax,
      0
    );

    map[safeKey].cost+=serviceRows.reduce(
      (sum,row)=>sum+row.cost,
      0
    );

    map[safeKey].sales+=saleAmount;

  });


  let rows=Object.values(map).sort(
    (a,b)=>
      direction==='desc'
        ? b.services-a.services
        : a.services-b.services
  );


  if(limit!=='all'){
    rows=rows.slice(0,Number(limit)||5);
  }


  const totals=rows.reduce(
    (a,row)=>({
      services:a.services+row.services,
      pax:a.pax+row.pax,
      sales:a.sales+row.sales,
      cost:a.cost+row.cost
    }),
    {
      services:0,
      pax:0,
      sales:0,
      cost:0
    }
  );


  return {
    rows,
    totals
  };

}

function filterTours(value){

function renderToursTable(){

 const box=$('tm-tours-table');

 if(!box)return;

 let rows=(db.tours||[])
   .slice()
   .sort((a,b)=>
     String(a.name||'').localeCompare(
       String(b.name||''),
       'es',
       {sensitivity:'base'}
     )
   );

 const search=String(window.tmToursSearch||'')
   .toLowerCase();

 if(search){

   rows=rows.filter(t=>
     String(t.name||'')
       .toLowerCase()
       .includes(search)
   );

 box.innerHTML=tourTableHtml(rows);

function tourTableHtml(rows){

 const total=rows.length;
 const totalPages=Math.max(1,Math.ceil(total/20));

 if(window.tmToursPage>totalPages)
   window.tmToursPage=totalPages;

 const page=window.tmToursPage||1;
 const start=(page-1)*20;
 const visible=rows.slice(start,start+20);
 const count=$('tm-tour-count');

 if(count){
   count.textContent=total
     ? `Mostrando ${start+1}-${Math.min(start+20,total)} de ${total} tours`
     : '0 tours';
 }

 if(!visible.length){
   return `
     <div class="empty">
       No se encontraron tours.
     </div>
   `;
 }

 return `
 <div style="overflow-x:auto">
   <table>
     <thead>
       <tr>
         <th>Tour</th>
         <th>Precio de venta</th>
         <th>Costo</th>
         <th>Margen de utilidad</th>
         <th>Vigencia</th>
         <th></th>
       </tr>
     </thead>

     <tbody>

       ${visible.map(t=>{

         // Utilizar primero la tarifa vigente.
         // Si no existe, conservar los valores originales del tour.
         const sale=Number(
           t.currentRateSalePrice ??
           t.hotel ??
           0
         );

         const cost=Number(
           t.currentRateCost ??
           t.cost ??
           0
         );

         const margin=sale-cost;

         const hasRate=
           t.currentRateFrom &&
           t.currentRateTo;

         return `
         <tr>

           <td>
             <strong>${esc(t.name)}</strong>
           </td>

           <td>
             ${money(sale)}
           </td>

           <td>
             ${money(cost)}
           </td>

           <td>
             <strong>${money(margin)}</strong>
           </td>

           <td>
             ${
               hasRate
               ? `<span style="font-size:12px;color:#475569">
                    ${rateDate(t.currentRateFrom)}
                    al
                    ${rateDate(t.currentRateTo)}
                  </span>`
               : `<span style="font-size:12px;color:#b45309">
                    Sin tarifa vigente
                  </span>`
             }
           </td>

           <td>
             <button
               class="secondary"
               type="button"
               onclick="tourForm('${t.id}')">
               Editar
             </button>
           </td>

         </tr>
         `;

       }).join('')}

     </tbody>
   </table>
 </div>

 <div style="
   display:flex;
   justify-content:center;
   align-items:center;
   gap:10px;
   margin-top:18px;
   flex-wrap:wrap;
 ">

   <button

     type="button"
     ${page<=1?'disabled':''}
     onclick="tourPage(${page-1})">
     ‹ Anterior
   </button>

   <span style="
     font-size:13px;
     color:#64748b;
     padding:0 8px;
   ">
     Página ${page} de ${totalPages}
   </span>

   <button
     class="secondary"
     type="button"
     ${page>=totalPages?'disabled':''}
     onclick="tourPage(${page+1})">
     Siguiente ›
   </button>

 </div>
 `;
}

async function loadTourRates(tourId){

 const response = await fetch(
   '/api/tour-rates/'+encodeURIComponent(tourId),
   {
     method:'GET',
     headers:{
       'Content-Type':'application/json'
     }
   }
 );

 const data = await response.json().catch(()=>({}));

 if(!response.ok){
   throw new Error(
     data.error ||
     'No fue posible cargar las tarifas del tour.'
   );
 }

 return Array.isArray(data.rates)
   ? data.rates
   : [];
}

function rateDate(value){
 if(!value)return '';
 const raw=String(value).slice(0,10);
 const m=raw.match(/^(\d{4})-(\d{2})-(\d{2})$/);
 return m?`${m[3]}/${m[2]}/${m[1]}`:raw;
}

function rateStatus(r){
 if(!r.active)
   return '<span class="badge pending">Inactiva</span>';

 const today=new Date();

 const iso=
   today.getFullYear()+'-'+
   String(today.getMonth()+1).padStart(2,'0')+'-'+
   String(today.getDate()).padStart(2,'0');

 if(iso<r.validFrom)
   return '<span class="badge pending">Próxima</span>';

 if(iso>r.validTo)
   return '<span class="badge pending">Vencida</span>';

 return '<span class="badge">Vigente</span>';
}

function tourRatesHtml(rates){

 if(!rates.length)
   return `
     <div class="tm-rate-empty">
       No hay tarifas configuradas para este tour.
     </div>
   `;

 return `
 <div class="tm-rates-table-wrap">

   <table class="tm-rates-table">

     <thead>
       <tr>
         <th>Desde</th>
         <th>Hasta</th>
         <th>Costo</th>
         <th>Precio venta</th>
         <th>Margen</th>
         <th>Estado</th>
         <th></th>
       </tr>
     </thead>

     <tbody>

       ${rates.map(r=>`

         <tr>

           <td>${rateDate(r.validFrom)}</td>

           <td>${rateDate(r.validTo)}</td>

           <td>${money(r.cost)}</td>

           <td>${money(r.salePrice)}</td>

           <td>
             ${money(
               Number(r.salePrice||0) -
               Number(r.cost||0)
             )}
           </td>

           <td>${rateStatus(r)}</td>

           <td class="tm-rate-actions">

             <button
               type="button"
               class="secondary"
               onclick="editTourRate('${r.id}')">
               Editar
             </button>

             <button
               type="button"
               class="secondary"
               onclick="toggleTourRate('${r.id}',${!r.active})">
               ${r.active?'Inactivar':'Activar'}
             </button>

           </td>

         </tr>

       `).join('')}

     </tbody>

   </table>

 </div>
 `;
}

async function saveTourRate(tourId,rateId=''){

 const from=$('tm-rate-from')?.value||'';
 const to=$('tm-rate-to')?.value||'';
 const cost=Number($('tm-rate-cost')?.value||0);
 const salePrice=Number($('tm-rate-sale')?.value||0);
 const active=$('tm-rate-active')?.value!=='false';
 const msg=$('tm-rate-message');

 if(!from||!to){
   if(msg)msg.textContent='Debe indicar ambas fechas.';
   return;
 }

 if(to<from){
   if(msg)msg.textContent='La fecha final no puede ser anterior a la inicial.';
   return;
 }

 try{

   const payload={
     tourId,
     validFrom:from,
     validTo:to,
     cost,
     salePrice,
     active
   };

   const callApi=async(url,opt={})=>{
     const r=await fetch(
       url,
       Object.assign(
         {
           headers:{
             'Content-Type':'application/json'
           }
         },
         opt
       )
     );

     const data=await r.json().catch(()=>({}));

     if(!r.ok){
       throw new Error(
         data.error||'Error de servidor'
       );
     }

     return data;
   };

   if(rateId){

     await callApi(
       '/api/tour-rates/'+
       encodeURIComponent(rateId),
       {
         method:'PUT',
         body:JSON.stringify(payload)
       }
     );

   }else{

     await callApi(
       '/api/tour-rates',
       {
         method:'POST',
         body:JSON.stringify(payload)
       }
     );
   }

   tourForm(tourId);

 }catch(e){

   if(msg)
     msg.textContent=e.message||'No fue posible guardar la tarifa.';
   else
     alert(e.message||'No fue posible guardar la tarifa.');

 }
}

async function saveTour(id){

 const n=$('tourName').value.trim();

 if(!n)
   return alert('Ingrese el tour.');

 const hotel=+$('tourHotel')?.value||0;
 const cost=+$('tourCost')?.value||0;

 if(id){

   // EDITAR TOUR:
   // Solo se modifica el nombre.
   // Las tarifas se administran por vigencia.

   const t=db.tours.find(x=>x.id===id);

   if(t)
     t.name=n;

   saveDB();
   closeModal();

 }else{

   // NUEVO TOUR:
   // Conservamos costo y precio hotel inicial.

   const tour={
     id:uid(),
     name:n,
     hotel,
     cost
   };

   db.tours.push(tour);
   saveDB();

   // Crear automáticamente la primera tarifa 2026.
   try{

     const response=await fetch(
       '/api/tour-rates',
       {
         method:'POST',
         headers:{
           'Content-Type':'application/json'
         },
         body:JSON.stringify({
           tourId:tour.id,
           validFrom:'2026-01-01',
           validTo:'2026-12-15',
           cost,
           salePrice:hotel,
           active:true
         })
       }
     );

     const data=await response.json().catch(()=>({}));

     if(!response.ok){

       // El tour sí fue creado.
       // Informamos que la tarifa inicial no pudo crearse.

       closeModal();

       alert(
         'El tour fue creado, pero no se pudo crear automáticamente '+
         'la tarifa inicial 2026: '+
         (data.error||'Error de servidor')
       );

       return;
     }

     closeModal();

   }catch(e){

     closeModal();

     alert(
       'El tour fue creado, pero no se pudo crear automáticamente '+
       'la tarifa inicial 2026. '+
       (e.message||'Error de conexión.')
     );
   }
 }

 view='tours';
 render();
}

init();

'sales_analysis.view':'Análisis de ventas','best_sellers.view':'Más vendidos'};
const $=id=>document.getElementById(id);
async function api(url,opt){const r=await fetch(url,Object.assign({headers:{'Content-Type':'application/json'}},opt||{}));const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Error de servidor');return d}
function renderPermissions(selected=[]){

 $('tm-permissions-grid').innerHTML=catalog.map(([title,prefix,acts])=>{
  const report=prefix==='reports';
  if(report) return '<div class="tm-pgroup"><div class="tm-ptitle">'+title+'</div>'+
   acts.map(a=>{let p=prefix+'.'+a;return '<label class="tm-prow"><span>'+labels[a]+'</span><span></span><span><input type="checkbox" data-perm="'+p+'" '+(s.has(p)?'checked':'')+'></span><span></span><span></span></label>'}).join('')+'</div>';
  return '<div class="tm-pgroup"><div class="tm-ptitle">'+title+'</div>'+
   '<div class="tm-prow" style="font-weight:600"><span></span><span>Ver</span><span>Crear</span><span>Editar</span><span>Eliminar</span></div>'+
   acts.map(a=>'<label class="tm-prow"><span>'+title+'</span><span><input type="checkbox" data-perm="'+prefix+'.'+a+'" '+(s.has(prefix+'.'+a)?'checked':'')+'></span><span></span><span></span><span></span></label>').join('')+
   '</div>';
 }).join('');
 // For CRUD modules, one row per action would be confusing; replace with proper matrix.
 document.querySelectorAll('.tm-pgroup').forEach((g,i)=>{
  if(i===7) return;
  const [title,prefix,acts]=catalog[i];
  g.innerHTML='<div class="tm-ptitle">'+title+'</div><div class="tm-prow" style="font-weight:600"><span></span><span>Ver</span><span>Crear</span><span>Editar</span><span>Eliminar</span></div>'+
   '<div class="tm-prow"><span>Permisos</span>'+acts.map(a=>'<span><input type="checkbox" data-perm="'+prefix+'.'+a+'" '+(s.has(prefix+'.'+a)?'checked':'')+'></span>').join('')+'</div>';
 });
}
async function loadUsers(){
 const d=await api('/api/users');
 $('tm-users-list').innerHTML=d.users.map(u=>'<div class="tm-uitem" data-id="'+u.id+'"><strong>'+u.name+'</strong><small>'+u.email+'<br>'+(u.active?'Activo':'Inactivo')+'</small></div>').join('')||'<p>No hay usuarios.</p>';
 document.querySelectorAll('.tm-uitem').forEach(x=>x.onclick=()=>editUser(x.dataset.id));
}
async function editUser(id){
 const [uData,pData]=await Promise.all([api('/api/users'),api('/api/users/'+id+'/permissions')]);
 const u=uData.users.find(x=>x.id===id); if(!u)return;
 $('tm-user-id').value=u.id;$('tm-user-name').value=u.name;$('tm-user-email').value=u.email;
 $('tm-user-role').value=u.role;$('tm-user-active').value=String(u.active);$('tm-user-password').value='';
 renderPermissions(pData.permissions.filter(x=>x.allowed).map(x=>x.permission));
 $('tm-user-message').textContent='';
}
function newUser(){ $('tm-user-id').value='';$('tm-user-form').reset();$('tm-user-role').value='user';$('tm-user-active').value='true';renderPermissions([]);$('tm-user-message').textContent='';}
const tmNewUserBtn=$('tm-user-new');
if(tmNewUserBtn){
  tmNewUserBtn.disabled=false;
  tmNewUserBtn.removeAttribute('disabled');
  tmNewUserBtn.style.pointerEvents='auto';
  tmNewUserBtn.style.cursor='pointer';
  tmNewUserBtn.onclick=()=>newUser();
}
$('tm-user-cancel').onclick=()=>newUser();
$('tm-perm-all').onclick=()=>document.querySelectorAll('#tm-permissions-grid input').forEach(x=>x.checked=true);
$('tm-perm-none').onclick=()=>document.querySelectorAll('#tm-permissions-grid input').forEach(x=>x.checked=false);
$('tm-user-form').onsubmit=async e=>{
 e.preventDefault();try{
  const id=$('tm-user-id').value, body={name:$('tm-user-name').value,email:$('tm-user-email').value,role:$('tm-user-role').value,active:$('tm-user-active').value==='true'};
  if($('tm-user-password').value)body.password=$('tm-user-password').value;
  const u=id?(await api('/api/users/'+id,{method:'PATCH',body:JSON.stringify(body)})).user:(await api('/api/users',{method:'POST',body:JSON.stringify(body)})).user;
  const permissions=[...document.querySelectorAll('#tm-permissions-grid input:checked')].map(x=>x.dataset.perm);
  await api('/api/users/'+u.id+'/permissions',{method:'PUT',body:JSON.stringify({permissions})});
  $('tm-user-message').textContent='Usuario y permisos guardados correctamente.';await loadUsers();await editUser(u.id);
 }catch(err){$('tm-user-message').textContent=err.message}
};
window.TourManagerUsers={show:async()=>{$('tm-users-admin').style.display='block';await loadUsers();newUser()},hide:()=>{$('tm-users-admin').style.display='none'}};
})();
</script>

<script>
async function tmAuthInit(){
  const screen=document.getElementById('tm-auth-screen'), form=document.getElementById('tm-auth-form');
  async function req(url,opt){const r=await fetch(url,Object.assign({headers:{'Content-Type':'application/json'}},opt||{}));const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Error');return d}
  function show(setup){screen.style.display='flex';document.getElementById('tm-auth-title').textContent=setup?'Configuración inicial':'Tour Manager';document.getElementById('tm-auth-text').textContent=setup?'No hay usuarios. Crea el administrador inicial.':'Inicia sesión para continuar.';document.getElementById('tm-auth-name-wrap').style.display=setup?'block':'none';document.getElementById('tm-auth-name').required=setup;document.getElementById('tm-auth-submit').textContent=setup?'Crear administrador':'Entrar';}
  function hide(){screen.style.display='none'}
  try{
    const st=await req('/api/auth/status');
    if(st.authenticated){
      const p=await req('/api/auth/permissions'); TM_AUTH={user:st.user,permissions:p.permissions}; hide(); VIEWS=BASE_VIEWS.slice(); render(); return;
    }
    show(st.userCount===0);
    form.onsubmit=async e=>{e.preventDefault();document.getElementById('tm-auth-msg').textContent='';try{
      const setup=st.userCount===0; const body={email:document.getElementById('tm-auth-email').value,password:document.getElementById('tm-auth-password').value}; if(setup)body.name=document.getElementById('tm-auth-name').value;
      const d=await req(setup?'/api/auth/bootstrap':'/api/auth/login',{method:'POST',body:JSON.stringify(body)});
      const p=await req('/api/auth/permissions');TM_AUTH={user:d.user,permissions:p.permissions};hide();render();
    }catch(err){document.getElementById('tm-auth-msg').textContent=err.message;}};
  }catch(e){screen.style.display='flex';document.getElementById('tm-auth-msg').textContent='No fue posible conectar con el servidor.'}
}
async function tmLogout(){try{await fetch('/api/auth/logout',{method:'POST'});}finally{location.reload()}}
document.addEventListener('click',e=>{

  const current=
    e.target.closest?.('.tm-oc-actions details');

  document
    .querySelectorAll('.tm-oc-actions details[open]')
    .forEach(d=>{

      if(d!==current){
        d.removeAttribute('open');
      }

    });

});

document.addEventListener('DOMContentLoaded',tmAuthInit);
</script>
