<style id="tm-modern-oc-ui">

/* ==========================================================
   MODERNIZACIÓN VISUAL — NUEVA / EDITAR OC
   No modifica IDs, datos ni lógica JavaScript.
   ========================================================== */

#modal .grid {
  display:grid !important;
  grid-template-columns:repeat(2,minmax(0,1fr)) !important;
  gap:18px !important;
  align-items:start !important;
}

/* Contenedor principal de la ventana */
#modal > div,
.modal {
  max-width:1280px;
}

/* Campos */
#modal .grid .field {
  min-width:0;
}

/* Inputs, selects y textarea */
#modal .grid input,
#modal .grid select,
#modal .grid textarea {
  width:100%;
  box-sizing:border-box;
}

/* ==========================================================
   AGRUPACIÓN VISUAL POR BLOQUES
   ========================================================== */

/* Cliente / cuenta + pasajero */
#modal .grid .field:nth-child(1),
#modal .grid .field:nth-child(2) {
  background:#f8fafc;
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:14px;
}

/* Tour / proveedor / vendedor */
#modal .grid .field:nth-child(3),
#modal .grid .field:nth-child(4),
#modal .grid .field:nth-child(5) {
  background:#f8fafc;
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:14px;
}

/* Fecha / hora */
#modal .grid .field:nth-child(6),
#modal .grid .field:nth-child(7),
#modal .grid .field:nth-child(8) {
  background:#f8fafc;
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:14px;
}

/* Pickup / Drop Off */
#modal .grid .field:nth-child(9),
#modal .grid .field:nth-child(10) {
  background:#f8fafc;
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:14px;
}

/* Costos */
#modal .grid .field:nth-child(11),
#modal .grid .field:nth-child(12),
#modal .grid .field:nth-child(13) {
  background:#f8fafc;
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:14px;
}

/* Observaciones ocupa todo el ancho */
#modal .grid .field.full,
#modal .grid textarea {
  grid-column:1 / -1;
}

/* ==========================================================
   ETIQUETAS
   ========================================================== */

#modal .grid .field label {
  display:block;
  margin-bottom:7px;
  font-weight:600;
  color:#526784;
  font-size:14px;
}

/* ==========================================================
   INPUTS
   ========================================================== */

#modal .grid input,
#modal .grid select,
#modal .grid textarea {
  border:1px solid #cbd5e1;
  border-radius:10px;
  background:#fff;
  min-height:42px;
  padding:9px 12px;
  font-size:15px;
  transition:border-color .15s ease, box-shadow .15s ease;
}

#modal .grid input:focus,
#modal .grid select:focus,
#modal .grid textarea:focus {
  outline:none;
  border-color:#0f766e;
  box-shadow:0 0 0 3px rgba(15,118,110,.10);
}

/* Observaciones */
#modal .grid textarea {
  min-height:90px;
  resize:vertical;
}

/* ==========================================================
   HORA
   ========================================================== */

#modal #ocHour,
#modal #ocMinute,
#modal #ocAmPm {
  min-height:42px;
}

#modal #ocMinute {
  width:80px !important;
}

#modal #ocAmPm {
  width:95px !important;
}

/* ==========================================================
   IVA
   ========================================================== */

#modal #ocTaxApply {
  width:20px;
  height:20px;
  accent-color:#0f766e;
  vertical-align:middle;
}

#modal #ocTaxApply + label {
  display:inline;
  margin-left:6px;
}

/* ==========================================================
   RESUMEN DE TOTALES
   ========================================================== */

#modal .oc-summary-modern {
  grid-column:1 / -1;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:0;
  margin-top:4px;
  border:1px solid #d7e4df;
  border-radius:14px;
  background:linear-gradient(135deg,#f3faf8,#f8fbfa);
  overflow:hidden;
}

#modal .oc-summary-modern .oc-total-item {
  padding:18px;
  text-align:center;
  border-right:1px solid #d7e4df;
}

#modal .oc-summary-modern .oc-total-item:last-child {
  border-right:0;
}

#modal .oc-summary-modern small {
  display:block;
  color:#64748b;
  font-size:13px;
  margin-bottom:5px;
}

#modal .oc-summary-modern strong {
  display:block;
  font-size:21px;
  color:#17324d;
}

#modal .oc-summary-modern .oc-grand-total strong {
  font-size:27px;
  color:#0f766e;
}

/* ==========================================================
   BOTONES
   ========================================================== */

#modal button {
  border-radius:10px;
}

#modal button.primary {
  background:#0f766e;
  border-color:#0f766e;
}

#modal button.primary:hover {
  filter:brightness(.95);
}

/* ==========================================================
   RESPONSIVE
   ========================================================== */

@media (max-width:900px) {

  #modal .grid {
    grid-template-columns:1fr !important;
  }

  #modal .grid .field.full,
  #modal .oc-summary-modern {
    grid-column:1;
  }

  #modal .oc-summary-modern {
    grid-template-columns:1fr;
  }

  #modal .oc-summary-modern .oc-total-item {
    border-right:0;
    border-bottom:1px solid #d7e4df;
  }

  #modal .oc-summary-modern .oc-total-item:last-child {
    border-bottom:0;
  }
}

</style>

function localDate(){
 const d=new Date();
 const y=d.getFullYear();

function dashboard(){

 const period=window.dashboardPeriod||'month';
 const today=new Date();

 function isoDate(d){
   return d.getFullYear()+'-'+
     String(d.getMonth()+1).padStart(2,'0')+'-'+
     String(d.getDate()).padStart(2,'0');
 }

 function parseDate(value){
   if(!value)return null;
   const raw=String(value).trim();
   const m=raw.match(/^(\d{4})-(\d{2})-(\d{2})/);
   if(m)return new Date(Number(m[1]),Number(m[2])-1,Number(m[3]));
   const d=new Date(raw);
   return Number.isNaN(d.getTime())?null:d;
 }

 function inRange(value,from,to){
   const d=parseDate(value);
   if(!d)return false;
   d.setHours(0,0,0,0);
   return (!from||d>=from)&&(!to||d<=to);
 }

 let from=null;
 let to=new Date(today);
 to.setHours(23,59,59,999);

 if(period==='month'){
   from=new Date(today.getFullYear(),today.getMonth(),1);
   from.setHours(0,0,0,0);
 }else if(period==='previous'){
   from=new Date(today.getFullYear(),today.getMonth()-1,1);
   from.setHours(0,0,0,0);
   to=new Date(today.getFullYear(),today.getMonth(),0);
   to.setHours(23,59,59,999);
 }else if(period==='30'){
   from=new Date(today);
   from.setDate(from.getDate()-29);
   from.setHours(0,0,0,0);
 }else if(period==='year'){
   from=new Date(today.getFullYear(),0,1);
   from.setHours(0,0,0,0);
 }else if(period==='custom'){
   const cf=parseDate(window.dashboardFrom||'');
   const ct=parseDate(window.dashboardTo||'');
   if(cf)from=cf;
   if(ct){
     to=ct;
     to.setHours(23,59,59,999);
   }
 }else if(period==='all'){
   from=null;
   to=null;
 }

 const filteredSales=db.sales.filter(x=>period==='all'||inRange(x.serviceDate,from,to));
 const filteredOrders=db.orders.filter(x=>period==='all'||inRange(x.serviceDate,from,to));

   a+(Number(x.subtotal||0)-Number(x.discountAmount||0)),0);

function displayDateTime(value){
 const raw=String(value||'').trim();
 if(!raw)return '-';

 const d=new Date(raw);

 if(Number.isNaN(d.getTime()))return raw;

 const date=
   String(d.getDate()).padStart(2,'0')+
   '/'+
   String(d.getMonth()+1).padStart(2,'0')+
   '/'+
   d.getFullYear();

 let h=d.getHours();
 const m=String(d.getMinutes()).padStart(2,'0');
 const ampm=h>=12?'PM':'AM';

 h=h%12;
 if(h===0)h=12;

 return date+
   ' · '+
   String(h).padStart(2,'0')+
   ':'+
   m+
   ' '+
   ampm;
}

function displayServiceDate(value){
 const raw=String(value||'').trim();
 if(!raw)return '-';

 const m=raw.match(/^(\d{4})-(\d{2})-(\d{2})/);
 if(m)return `${m[3]}/${m[2]}/${m[1]}`;

 const d=new Date(raw);
 if(!Number.isNaN(d.getTime())){
   return String(d.getDate()).padStart(2,'0')+'/'+
          String(d.getMonth()+1).padStart(2,'0')+'/'+
          d.getFullYear();
 }

 return raw;
}

function formatServiceTime(value){
 const raw=String(value||'').trim();
 if(!raw)return '-';

 const m=raw.match(/^(\d{1,2}):(\d{2})/);
 if(!m)return raw;

 let h=Number(m[1]);
 const min=m[2];

 if(Number.isNaN(h))return raw;

 const ampm=h>=12?'PM':'AM';
 h=h%12;
 if(h===0)h=12;

 return String(h).padStart(2,'0')+':'+min+' '+ampm;
}

function timeParts(value){
 const raw=String(value||'').trim();
 const m=raw.match(/^(\d{1,2}):(\d{2})/);

 if(!m){
   return {hour:'',minute:'',ampm:'AM'};
 }

 let h=Number(m[1]);
 const minute=m[2];

 if(h>=12){
   return {
     hour:String(h===12?12:h-12).padStart(2,'0'),
     minute,
     ampm:'PM'
   };
 }

 return {
   hour:String(h===0?12:h).padStart(2,'0'),
   minute,
   ampm:'AM'
 };
}


function normalizeOcTime(){
 const el=$('ocMinute');
 if(!el)return;

 let n=Number(el.value||0);

 if(Number.isNaN(n))n=0;
 n=Math.max(0,Math.min(59,Math.round(n)));

 el.value=String(n).padStart(2,'0');
}

function timeTo24(){
 const h=Number($('ocHour')?.value||0);
 normalizeOcTime(); const minute=String($('ocMinute')?.value||'00').padStart(2,'0');
 const ampm=$('ocAmPm')?.value||'AM';

 if(!h)return '';

 let hour=h%12;
 if(ampm==='PM')hour+=12;

 return String(hour).padStart(2,'0')+':'+minute;
}

async function orderCostFromTour(){

 const tourId=$('ocTour')?.value||'';
 const serviceDate=$('ocService')?.value||'';
 const costInput=$('ocCost');

 if(!tourId||!serviceDate||!costInput){
   orderCalc();
   return;
 }

 // En una OC existente NO cambiamos automáticamente el costo.
 // La tarifa por vigencia se aplica únicamente al crear una OC nueva.
 const editing=window.tmEditingOrder===true;

 if(editing){
   orderCalc();
   return;
 }

 try{

   const d=await api(
     '/api/tour-rates/'+
     encodeURIComponent(tourId)
   );

   const rates=d.rates||[];

   const rate=rates
     .filter(r=>
       r.active &&
       String(r.validFrom||'').slice(0,10)<=serviceDate &&
       String(r.validTo||'').slice(0,10)>=serviceDate
     )
     .sort((a,b)=>
       String(b.validFrom||'').localeCompare(
         String(a.validFrom||'')
       )
     )[0];

   const info=$('tm-oc-rate-info');

   if(rate){

     costInput.value=Number(rate.cost||0).toFixed(2);

     if(info){

       info.innerHTML=
         '<span style="color:#14877f;font-weight:700">✓ Tarifa aplicada</span> '+
         rateDate(rate.validFrom)+
         ' al '+
         rateDate(rate.validTo)+
         ' · Costo: '+
         money(rate.cost);

     }

   }else{

     if(info){

       info.innerHTML=
         '<span style="color:#b45309;font-weight:700">⚠ Sin tarifa configurada</span> '+
         'para este tour en la fecha seleccionada. '+
         'Puede ingresar el costo manualmente.';

     }

     const t=db.tours.find(x=>x.id===tourId);

     if(t && !costInput.value)
       costInput.value=Number(t.cost||0).toFixed(2);

   }

 }catch(e){

   const info=$('tm-oc-rate-info');

   if(info){

     info.innerHTML=
       '<span style="color:#b91c1c;font-weight:700">No se pudo consultar la tarifa.</span> '+
       esc(e.message);

   }

 }

 orderCalc();
}
function orderCalc(){const base=(+$('ocPax')?.value||0)*(+$('ocCost')?.value||0);const x=calc(base,$('ocTaxApply')?.checked!==false);$('ocSub').textContent=money(x.subtotal);$('ocTax').textContent=money(x.tax);$('ocTotal').textContent=money(x.total)}
function orderData(){
 const sellerId=$('ocSeller').value,passenger=$('ocPassenger').value.trim(),service=$('ocService').value;

 const t=db.tours.find(x=>x.id===$('ocTour').value),c=db.clients.find(x=>x.id===$('ocClient').value),applyTax=$('ocTaxApply')?.checked!==false,x=calc((+$('ocPax').value||0)*(+$('ocCost').value||0),applyTax);

async function saveOrder(id){
 const o=db.orders.find(x=>x.id===id);
 const d=orderData();

 if(!o||!d)return;

 const btn=document.querySelector('.modal .primary');
 if(btn){btn.disabled=true;btn.textContent='Guardando...';}

 try{
   const r=await fetch('/api/purchase-orders/'+encodeURIComponent(id),{
     method:'PUT',
     headers:{'Content-Type':'application/json'},
     body:JSON.stringify({
       ...d,
       updatedAt:o.updatedAt
     })
   });

   const data=await r.json();

   if(r.status===409){
     alert(data.error||'Esta OC fue modificada por otro usuario. Recargue la información antes de guardarla.');
     return;
   }

   if(!r.ok){
     throw new Error(data.error||'No fue posible actualizar la OC.');
   }

   const x=data.order;

   Object.assign(o,{
     id:x.id,
     number:x.number,
     op:x.operation_number,
     clientId:x.client_id,
     client:d.client,
     supplierId:x.supplier_id,
     sellerId:x.seller_id,
     tourId:x.tour_id,
     customerName:x.client_name,
     issueDate:dateOnly(x.issue_date),
     serviceDate:dateOnly(x.service_date),
     time:x.service_time||'',
     place:x.pickup_place||'',dropOff:x.drop_off||'',
     pax:Number(x.passengers||0),
     unitCost:Number(x.unit_cost||0),
     subtotal:Number(x.subtotal||0),
     taxRate:Number(x.tax_rate ?? 0),
     tax:Number(x.tax_amount||0),
     total:Number(x.total||0),
     currency:x.currency||'USD',
     notes:x.notes||'',
     paymentStatus:x.payment_status||o.paymentStatus||'Pendiente',
     paymentDate:x.payment_date,
     paymentReceipt:x.payment_receipt,
     saleId:x.sale_id,
     updatedAt:x.updated_at,
     seller:d.seller,
     tour:d.tour
   });

   closeModal();
   alert('OC '+o.number+' actualizada.');

   view='orders';
   render();

 }catch(e){
   alert(e.message);
 }finally{
   if(btn){btn.disabled=false;btn.textContent='Guardar OC';}
 }
}

function renderPayments(){

 const sf=$('paySupplier')?.value||'';
 const q=($('paySearch')?.value||'').trim().toLowerCase();

 const from=$('payDateFrom')?.value||'';
 const to=$('payDateTo')?.value||'';

 /*
  * ==========================================================
  * CxP
  *
  * IMPORTANTE:
  * El filtro utiliza serviceDate.
  * NO utiliza fecha de creación de la OC.
  * NO utiliza fecha de pago.
  * ==========================================================
  */

 if(from && to && from>to){

   $('pendingPayments').innerHTML=`
     <div class="notice">
       <b>Rango de fechas inválido.</b><br>
       La fecha desde no puede ser posterior a la fecha hasta.
     </div>
   `;

 } else {

   const rows=db.orders
     .filter(o=>{

       // Solo pendientes
       if(o.paymentStatus==='Pagado')return false;

       // Filtro proveedor
       if(sf && o.supplierId!==sf)return false;

       // Fecha real del servicio
       const service=String(
         dateOnly(o.serviceDate)||''
       ).slice(0,10);

       if(from && service<from)return false;
       if(to && service>to)return false;

       // Búsqueda
       if(q){

         const text=[
           o.number,
           o.op,
           o.customerName,
           o.tour,
           supplier(o.supplierId)
         ]
         .join(' ')
         .toLowerCase();

         if(!text.includes(q))return false;
       }

       return true;

     })
     .sort((a,b)=>{

       const da=String(
         dateOnly(a.serviceDate)||''
       );

       const dbb=String(
         dateOnly(b.serviceDate)||''
       );

       return da.localeCompare(dbb)
         || a.number.localeCompare(b.number);

     });


   /*
    * Agrupar por proveedor
    */

   const supplierGroups={};

   rows.forEach(o=>{

     const sid=o.supplierId||'sin-proveedor';

     if(!supplierGroups[sid]){

       supplierGroups[sid]={
         supplierId:o.supplierId,
         name:supplier(o.supplierId),
         orders:[],
         total:0
       };

     }

     supplierGroups[sid].orders.push(o);

     supplierGroups[sid].total+=Number(
       o.total||0
     );

   });


   const groups=Object.values(
     supplierGroups
   );

   const grandTotal=rows.reduce(
     (a,o)=>a+Number(o.total||0),
     0
   );


   /*
    * Resumen CxP
    */

   const summary=`

     <div style="
       display:grid;
       grid-template-columns:
         repeat(3,minmax(0,1fr));
       gap:12px;
       margin-bottom:18px;
     ">

       <div style="
         padding:16px;
         border:1px solid #e2e8ee;
         border-radius:14px;
         background:#f8fafc;
       ">
         <small style="color:#64748b">
           Proveedores
         </small>

         <div style="
           font-size:24px;
           font-weight:700;
           margin-top:5px;
         ">
           ${groups.length}
         </div>
       </div>


       <div style="
         padding:16px;
         border:1px solid #e2e8ee;
         border-radius:14px;
         background:#f8fafc;
       ">
         <small style="color:#64748b">
           Servicios pendientes
         </small>

         <div style="
           font-size:24px;
           font-weight:700;
           margin-top:5px;
         ">
           ${rows.length}
         </div>
       </div>


       <div style="
         padding:16px;
         border:1px solid #e2e8ee;
         border-radius:14px;
         background:#f8fafc;
       ">
         <small style="color:#64748b">
           Total CxP
         </small>

         <div style="
           font-size:24px;
           font-weight:700;
           margin-top:5px;
         ">
           ${money(grandTotal)}
         </div>
       </div>

     </div>

   `;


   const rangeText=
     from||to

       ? `<div style="
            margin-bottom:14px;
            color:#64748b;
            font-size:13px;
          ">
            Servicios desde
            <b>
              ${from
                ? displayServiceDate(from)
                : 'el inicio'}
            </b>
            hasta
            <b>
              ${to
                ? displayServiceDate(to)
                : 'el final'}
            </b>
          </div>`

       : `<div style="
            margin-bottom:14px;
            color:#64748b;
            font-size:13px;
          ">
            Mostrando todas las OCs pendientes de pago.
          </div>`;


   /*
    * Proveedores
    */

   const groupedHtml=groups.map(g=>`

     <div style="
       border:1px solid #e2e8ee;
       border-radius:15px;
       overflow:hidden;
       margin-bottom:16px;
       background:#fff;
     ">

       <div style="
         display:flex;
         justify-content:space-between;
         align-items:center;
         gap:15px;
         padding:15px 18px;
         background:#f8fafc;
         border-bottom:1px solid #e2e8ee;
       ">

         <div>

           <strong style="font-size:16px">
             ${esc(g.name)}
           </strong>

           <div style="
             font-size:12px;
             color:#64748b;
             margin-top:3px;
           ">
             ${g.orders.length}
             servicio(s) pendiente(s)
           </div>

         </div>

         <strong style="font-size:18px">
           ${money(g.total)}
         </strong>

       </div>


       <div style="overflow-x:auto">

         <table style="margin:0">

           <tr>

             <th>
               <input
                 type="checkbox"
                 onchange="
                   document
                     .querySelectorAll(
                       '.payGroup-${esc(g.supplierId||'none')}'
                     )
                     .forEach(x=>x.checked=this.checked)
                 ">
             </th>

             <th>OC</th>
             <th>Cliente</th>
             <th>Tour</th>
             <th>Fecha servicio</th>
             <th>Total</th>
             <th></th>

           </tr>


           ${g.orders.map(o=>`

             <tr>

               <td>

                 <input
                   class="payItem payGroup-${esc(g.supplierId||'none')}"
                   type="checkbox"
                   value="${o.id}">

               </td>


               <td>
                 <b>${o.number}</b>
               </td>


               <td>
                 ${esc(o.customerName)}
               </td>


               <td>
                 ${esc(o.tour)}
               </td>


               <td>

                 ${displayServiceDate(o.serviceDate)}

                 ${
                   o.time
                     ? `<br>
                        <small>
                          ${formatServiceTime(o.time)}
                        </small>`
                     : ''
                 }

               </td>


               <td>
                 <b>${money(o.total)}</b>
               </td>


               <td>

                 <button
                   class="secondary"
                   onclick="previewOrder('${o.id}')">
                   Ver OC
                 </button>

               </td>

             </tr>

           `).join('')}

         </table>

       </div>

     </div>

   `).join('');


   $('pendingPayments').innerHTML=rows.length

     ? summary+rangeText+groupedHtml

     : `<div class="empty">

          ${summary}

          <b>
            No hay OCs pendientes de pago
            con estos filtros.
          </b>

        </div>`;

 }


 /*
  * ==========================================================
  * HISTORIAL
  *
  * NO se modifica la estructura de los pagos.
  * Se mantiene Vista previa.
  * ==========================================================
  */

 const hf=$('historySupplier')?.value||'';

 const hq=(
   $('historySearch')?.value||''
 )
 .trim()
 .toLowerCase();


 const ps=db.payments
   .filter(p=>

     (!hf||p.supplierId===hf)

     &&

     (
       !hq
       ||
       [
         p.number,
         p.receipt,
         supplier(p.supplierId),

         ...(p.orderIds||[])
           .map(
             i=>db.orders.find(
               o=>o.id===i
             )?.number||''
           )

       ]
       .join(' ')
       .toLowerCase()
       .includes(hq)
     )

   )
   .slice()
   .reverse();


 $('paymentHistory').innerHTML=ps.length

   ? `<table>

       <tr>
         <th>Pago</th>
         <th>Proveedor</th>
         <th>Fecha</th>
         <th>Comprobante</th>
         <th>Total</th>
         <th>OCs</th>
         <th>Acción</th>
       </tr>

       ${ps.map(p=>`

         <tr>

           <td>${p.number}</td>

           <td>
             ${esc(
               supplier(p.supplierId)
             )}
           </td>

           <td>
             ${displayServiceDate(p.date)}
           </td>

           <td>
             ${esc(p.receipt)}
           </td>

           <td>
             ${money(p.total)}
           </td>

           <td>
             ${(p.orderIds||[])
               .map(
                 i=>db.orders.find(
                   o=>o.id===i
                 )?.number||''
               )
               .join(', ')}
           </td>

           <td>

             <button
               class="secondary"
               onclick="previewPayment('${p.id}')">
               Vista previa
             </button>

           </td>

         </tr>

       `).join('')}

     </table>`

   : '<div class="empty">No hay pagos registrados.</div>';

}

 pendingPaymentOrderIds=os.map(o=>o.id);
 modal('Registrar pago',`<div class="notice"><b>${os.length}</b> OC(s) · Proveedor: <b>${esc(supplier(ss[0]))}</b> · Total: <b>${money(total)}</b></div>

function applyPayment(){
 const ids=[...pendingPaymentOrderIds];
 if(!ids.length)return alert('No hay OCs seleccionadas para este pago.');
 const date=$('paymentDate').value,receipt=$('paymentReceipt').value.trim();if(!date||!receipt)return alert('Complete fecha y número de comprobante.');
 const os=ids.map(i=>db.orders.find(o=>o.id===i)).filter(Boolean),ss=[...new Set(os.map(o=>o.supplierId))];
 if(!os.length||ss.length!==1)return alert('Selección de pago inválida.');
 if(os.some(o=>o.paymentStatus==='Pagado'))return alert('Una OC seleccionada ya está pagada. Actualice la pantalla.');
 const p={id:uid(),number:next('P'),supplierId:ss[0],date,receipt,total:os.reduce((a,o)=>a+Number(o.total||0),0),orderIds:os.map(o=>o.id)};
 db.payments.push(p);os.forEach(o=>{o.paymentStatus='Pagado';o.paymentDate=date;o.paymentReceipt=receipt;o.paymentId=p.id});
 pendingPaymentOrderIds=[];
 saveDB();closeModal();alert('Pago '+p.number+' aplicado correctamente.');
}

function saleForm(orderId){

 window.__currentSaleOrderId=orderId;

 const o=db.orders.find(x=>x.id===orderId);
 if(!o)return;
 if(o.saleId)return alert('Esta OC ya tiene factura.');

 const t=db.tours.find(x=>x.id===o.tourId);

 modal('Generar factura desde '+o.number,`
 <div class="grid">

   <div class="field">
     <label>Cliente</label>
     <input disabled value="${esc(o.customerName)}">
   </div>

   <div class="field">
     <label>Tour</label>
     <input disabled value="${esc(o.tour)}">
   </div>

   <div class="field">
     <label>Precio de venta unitario *</label>
     <input id="salePrice"
            type="number"
            step=".01"
            min="0"
            value="${t?.hotel||0}"
            oninput="saleCalc()">
   </div>

   <div class="field">
     <label>Descuento %</label>
     <input id="saleDiscount"
            type="number"
            step=".01"
            min="0"
            value="0"
            oninput="saleCalc()">
   </div>

   <div class="field">
     <label style="display:flex;align-items:center;gap:8px;margin-top:28px">
       <input id="saleTaxApply"
              type="checkbox"
              checked
              onchange="saleCalc()">
       Aplicar IVA 13%
     </label>
   </div>

 </div>

 <div class="card" style="margin-top:16px">
   <div style="display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap">
     <div>
       <small>Subtotal</small>
       <div id="saleSub" style="font-size:20px;font-weight:600">$0.00</div>
     </div>

     <div>
       <small>Descuento</small>
       <div id="saleDiscountAmount" style="font-size:20px;font-weight:600">$0.00</div>
     </div>

     <div>
       <small>IVA 13%</small>
       <div id="saleTax" style="font-size:20px;font-weight:600">$0.00</div>
     </div>

     <div>
       <small>TOTAL</small>
       <div id="saleTotal" style="font-size:26px;font-weight:700">$0.00</div>
     </div>
   </div>
 </div>

 <div class="actions">
   <button class="secondary" onclick="closeModal()">Cancelar</button>
   <button class="primary" onclick="createSale('${orderId}')">Generar factura</button>
 </div>
 `);

 saleCalc();
}

function saleCalc(){

 const o=db.orders.find(x=>x.id===document.querySelector('#salePrice')?.closest('.modal')?.dataset?.orderId)
       ||db.orders.find(x=>x.id===window.__saleOrderId);

 const price=+$('salePrice')?.value||0;
 const dp=+$('saleDiscount')?.value||0;

 const order=o||db.orders.find(x=>x.id===window.__currentSaleOrderId);

 const pax=order?.pax||1;
 const subtotal=pax*price;
 const discount=subtotal*dp/100;
 const applyTax=$('saleTaxApply')?.checked!==false;

 const x=calc(subtotal-discount,applyTax);

 if($('saleSub'))$('saleSub').textContent=money(subtotal);
 if($('saleDiscountAmount'))$('saleDiscountAmount').textContent='-'+money(discount);
 if($('saleTax'))$('saleTax').textContent=applyTax?money(x.tax):'No aplica';
 if($('saleTotal'))$('saleTotal').textContent=money(x.total);
}

function createSale(orderId){
 const o=db.orders.find(x=>x.id===orderId),price=+$('salePrice').value||0,dp=+$('saleDiscount').value||0;
 if(price<=0)return alert('Ingrese el precio de venta.');
 const subtotal=o.pax*price,discount=subtotal*dp/100,applyTax=$('saleTaxApply')?.checked!==false,x=calc(subtotal-discount,applyTax);
 const s={id:uid(),number:next('V'),op:o.op,orderId:o.id,clientId:o.clientId,customerName:o.customerName,tourId:o.tourId,tour:o.tour,sellerId:o.sellerId,seller:o.seller,serviceDate:o.serviceDate,pax:o.pax,unitPrice:price,discount:dp,subtotal,discountAmount:discount,taxableAmount:subtotal-discount,taxRate:applyTax?13:0,tax:x.tax,total:x.total,currency:o.currency};
 db.sales.push(s);o.saleId=s.id;saveDB();closeModal();alert('Factura '+s.number+' creada.');
}
function editSaleForm(id){
 const s=db.sales.find(x=>x.id===id);
 if(!s)return;
 modal('Editar factura '+s.number,`<div class="grid">
 <div class="field"><label>Cliente</label><input disabled value="${esc(s.customerName)}"></div>
 <div class="field"><label>Tour</label><input disabled value="${esc(s.tour)}"></div>
 <div class="field"><label>Precio de venta unitario *</label><input id="saleEditPrice" data-sale-id="${s.id}" type="number" step=".01" value="${s.unitPrice||0}"></div>
 <div class="field"><label>Descuento %</label><input id="saleEditDiscount" type="number" step=".01" value="${s.discount||0}"></div>
 <div class="field"><label style="display:flex;align-items:center;gap:8px;margin-top:28px"><input id="saleEditTaxApply" type="checkbox" ${Number(s.taxRate||0)>0?'checked':''}> Aplicar IVA 13%</label></div>
 </div>
 <div class="card">Subtotal: <b id="saleEditSub"></b> · IVA 13%: <b id="saleEditTax"></b> · TOTAL: <b id="saleEditTotal"></b></div>
 <div class="actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveSaleEdit('${id}')">Guardar cambios</button></div>`);
 saleEditCalc();
}

function saleEditCalc(){
 const s=db.sales.find(x=>x.id===$('saleEditPrice')?.dataset?.saleId);
 const price=+$('saleEditPrice')?.value||0,dp=+$('saleEditDiscount')?.value||0;
 const order=s?db.orders.find(x=>x.id===s.orderId):null;
 const pax=order?.pax||s?.pax||1;
 const applyTax=$('saleEditTaxApply')?.checked!==false;
 const subtotal=pax*price,discount=subtotal*dp/100,x=calc(subtotal-discount,applyTax);
 if($('saleEditSub'))$('saleEditSub').textContent=money(x.subtotal);
 if($('saleEditTax'))$('saleEditTax').textContent=money(x.tax);
 if($('saleEditTotal'))$('saleEditTotal').textContent=money(x.total);
}

async function saveSaleEdit(id){
 const s=db.sales.find(x=>x.id===id);
 if(!s)return;
 const price=+$('saleEditPrice').value||0,dp=+$('saleEditDiscount').value||0;
 if(price<=0)return alert('Ingrese el precio de venta.');
 const applyTax=$('saleEditTaxApply')?.checked!==false;
 const subtotal=(s.pax||1)*price,discount=subtotal*dp/100,x=calc(subtotal-discount,applyTax);
 Object.assign(s,{unitPrice:price,discount:dp,subtotal,discountAmount:discount,taxableAmount:subtotal-discount,taxRate:applyTax?13:0,tax:x.tax,total:x.total});
 saveDB();closeModal();alert('Factura '+s.number+' actualizada.');
}

function reportTab(which){document.querySelectorAll('.report').forEach(x=>x.style.display='none');$('rep'+(which==='future'?'Future':which==='seller'?'Seller':'Analysis')).style.display='block'}
function reportRows(){
 const f=$('rFutureFrom')?.value||'',t=$('rFutureTo')?.value||'';
 return db.orders
   .filter(o=>{
     const d=dateOnly(o.serviceDate);
     return (!f||d>=f)&&(!t||d<=t);
   })
   .sort((a,b)=>(dateOnly(a.serviceDate)+(a.time||'')).localeCompare(dateOnly(b.serviceDate)+(b.time||'')));
}
function renderReports(){
 if(!$('futureResult'))return;
 const future=reportRows();$('futureResult').innerHTML=future.length?`<table><tr><th>Fecha</th><th>Hora</th><th>Tour</th><th>Cliente</th><th>Vendedor</th><th>Proveedor</th><th>Pickup</th><th>Pax</th><th>OC</th></tr>${future.map(o=>`<tr><td>${dateOnly(o.serviceDate).split('-').reverse().join('/')}</td><td>${o.time||'-'}</td><td>${esc(o.tour)}</td><td>${esc(o.customerName)}</td><td>${esc(o.seller)}</td><td>${esc(supplier(o.supplierId))}</td><td>${esc(o.place||'-')}</td><td>${o.pax}</td><td>${o.number}</td></tr>`).join('')}</table>`:'<div class="empty">No hay servicios para el rango indicado.</div>';
 const sf=$('rSellerFrom')?.value||'',st=$('rSellerTo')?.value||'',sv=$('rSeller')?.value||'';
 const ss=db.sales.filter(s=>{
   const d=dateOnly(s.serviceDate);
   return (!sf||d>=sf)&&(!st||d<=st)&&(!sv||s.sellerId===sv);
 });
 const sellerRows=ss.map(s=>{const o=db.orders.find(x=>x.id===s.orderId),cost=Number(o?.subtotal||0),sale=Number(s.subtotal||0)-Number(s.discountAmount||0),margin=sale-cost,rate=Number(db.sellers.find(x=>x.id===s.sellerId)?.commissionRate||0),commission=Math.max(0,margin)*rate/100;return {s,cost,sale,margin,rate,commission};});
 const sellerTotals=sellerRows.reduce((a,r)=>({sale:a.sale+r.sale,cost:a.cost+r.cost,margin:a.margin+r.margin,commission:a.commission+r.commission}),{sale:0,cost:0,margin:0,commission:0});
 $('sellerResult').innerHTML=sellerRows.length?`<div class="cards" style="grid-template-columns:repeat(4,1fr);margin-bottom:12px"><div class="card"><small>Ventas sin IVA</small><div class="metric">${money(sellerTotals.sale)}</div></div><div class="card"><small>Costos sin IVA</small><div class="metric">${money(sellerTotals.cost)}</div></div><div class="card"><small>Margen</small><div class="metric">${money(sellerTotals.margin)}</div></div><div class="card"><small>Comisión a pagar</small><div class="metric">${money(sellerTotals.commission)}</div></div></div><table><tr><th>Fecha servicio</th><th>Vendedor</th><th>Tour</th><th>Cliente</th><th>Venta</th><th>Costo</th><th>Margen</th><th>%</th><th>Comisión</th></tr>${sellerRows.map(r=>`<tr><td>${dateOnly(r.s.serviceDate).split('-').reverse().join('/')}</td><td>${esc(r.s.seller)}</td><td>${esc(r.s.tour)}</td><td>${esc(r.s.customerName)}</td><td>${money(r.sale)}</td><td>${money(r.cost)}</td><td>${money(r.margin)}</td><td>${r.rate}%</td><td>${money(r.commission)}</td></tr>`).join('')}<tr><th colspan="4">TOTAL</th><th>${money(sellerTotals.sale)}</th><th>${money(sellerTotals.cost)}</th><th>${money(sellerTotals.margin)}</th><th></th><th>${money(sellerTotals.commission)}</th></tr></table>`:'<div class="empty">No hay ventas para el rango.</div>';
 const af=$('rAFrom')?.value||'',at=$('rATo')?.value||'',g=$('rGroup')?.value||'tour',ord=$('rOrder')?.value||'desc',lim=$('rLimit')?.value||'5';
 const base=db.orders.filter(o=>{
   const d=dateOnly(o.serviceDate);
   return (!af||d>=af)&&(!at||d<=at);
 }),map={};
 base.forEach(o=>{const key=g==='tour'?o.tour:g==='supplier'?supplier(o.supplierId):g==='seller'?o.seller:o.client;if(!map[key])map[key]={name:key,services:0,pax:0,sales:0,cost:0};map[key].services++;map[key].pax+=o.pax||0;map[key].cost+=o.subtotal||0;const s=db.sales.find(x=>x.orderId===o.id);if(s)map[key].sales+=s.subtotal-s.discountAmount});
 let ar=Object.values(map).sort((a,b)=>ord==='desc'?b.services-a.services:a.services-b.services);if(lim!=='all')ar=ar.slice(0,+lim);
 const analysisTotals=ar.reduce((a,x)=>({services:a.services+x.services,pax:a.pax+x.pax,sales:a.sales+x.sales,cost:a.cost+x.cost}),{services:0,pax:0,sales:0,cost:0});
 $('analysisResult').innerHTML=ar.length?`<div class="cards" style="grid-template-columns:repeat(5,1fr);margin-bottom:12px"><div class="card"><small>Servicios</small><div class="metric">${analysisTotals.services}</div></div><div class="card"><small>Pasajeros</small><div class="metric">${analysisTotals.pax}</div></div><div class="card"><small>Ventas sin IVA</small><div class="metric">${money(analysisTotals.sales)}</div></div><div class="card"><small>Costos sin IVA</small><div class="metric">${money(analysisTotals.cost)}</div></div><div class="card"><small>Margen</small><div class="metric">${money(analysisTotals.sales-analysisTotals.cost)}</div></div></div><table><tr><th>${g==='tour'?'Tour':g==='supplier'?'Proveedor':g==='seller'?'Vendedor':'Cliente'}</th><th>Servicios</th><th>Pax</th><th>Ventas sin IVA</th><th>Costos sin IVA</th><th>Margen</th></tr>${ar.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.services}</td><td>${x.pax}</td><td>${money(x.sales)}</td><td>${money(x.cost)}</td><td>${money(x.sales-x.cost)}</td></tr>`).join('')}<tr><th>TOTAL</th><th>${analysisTotals.services}</th><th>${analysisTotals.pax}</th><th>${money(analysisTotals.sales)}</th><th>${money(analysisTotals.cost)}</th><th>${money(analysisTotals.sales-analysisTotals.cost)}</th></tr></table>`:'<div class="empty">No hay datos.</div>';

function toExcel(rows,file,totals=null){if(!rows.length)return alert('No hay datos para exportar.');if(typeof XLSX==='undefined')return alert('No se pudo cargar el generador de Excel. Recargue la página e inténtelo nuevamente.');const data=rows.map(r=>({...r}));if(totals)data.push(totals);const ws=XLSX.utils.json_to_sheet(data);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Reporte');XLSX.writeFile(wb,file)}
function exportFuture(){const rows=reportRows().map(o=>({OC:o.number,FechaServicio:o.serviceDate,Hora:o.time||'',Tour:o.tour,Cliente:o.customerName,Vendedor:o.seller,Proveedor:supplier(o.supplierId),Pickup:o.place||'',Pax:Number(o.pax||0),Total:Number(o.total||0)}));const totalPax=rows.reduce((a,r)=>a+r.Pax,0),total=rows.reduce((a,r)=>a+r.Total,0);toExcel(rows,'tours_fecha_servicio.xlsx',{OC:'TOTAL',FechaServicio:'',Hora:'',Tour:'',Cliente:'',Vendedor:'',Proveedor:'',Pickup:'',Pax:totalPax,Total:total})}
function exportSeller(){const f=$('rSellerFrom').value,t=$('rSellerTo').value,sv=$('rSeller').value,ss=db.sales.filter(s=>(!f||s.serviceDate>=f)&&(!t||s.serviceDate<=t)&&(!sv||s.sellerId===sv));const rows=ss.map(s=>{const o=db.orders.find(x=>x.id===s.orderId),cost=Number(o?.subtotal||0),sale=Number(s.subtotal||0)-Number(s.discountAmount||0),margin=sale-cost,rate=Number(db.sellers.find(x=>x.id===s.sellerId)?.commissionRate||0),commission=Math.max(0,margin)*rate/100;return{FechaServicio:s.serviceDate,Vendedor:s.seller,Tour:s.tour,Cliente:s.customerName,Venta:sale,Costo:cost,Margen:margin,ComisionPorcentaje:rate,Comision:commission}});const totals=rows.reduce((a,r)=>({FechaServicio:'',Vendedor:'',Tour:'',Cliente:'TOTAL',Venta:a.Venta+r.Venta,Costo:a.Costo+r.Costo,Margen:a.Margen+r.Margen,ComisionPorcentaje:'',Comision:a.Comision+r.Comision}),{Venta:0,Costo:0,Margen:0,Comision:0});toExcel(rows,'vendedores_comisiones.xlsx',totals)}
function exportAnalysis(){const f=$('rAFrom').value,t=$('rATo').value,g=$('rGroup').value,rows=db.orders.filter(o=>(!f||o.serviceDate>=f)&&(!t||o.serviceDate<=t)),map={};rows.forEach(o=>{const k=g==='tour'?o.tour:g==='supplier'?supplier(o.supplierId):g==='seller'?o.seller:o.client;if(!map[k])map[k]={Nombre:k,Servicios:0,Pasajeros:0,VentasSinIVA:0,CostosSinIVA:0};map[k].Servicios++;map[k].Pasajeros+=Number(o.pax||0);map[k].CostosSinIVA+=Number(o.subtotal||0);const s=db.sales.find(x=>x.orderId===o.id);if(s)map[k].VentasSinIVA+=Number(s.subtotal||0)-Number(s.discountAmount||0)});const out=Object.values(map).map(x=>({Nombre:x.Nombre,Servicios:x.Servicios,Pasajeros:x.Pasajeros,VentasSinIVA:x.VentasSinIVA,CostosSinIVA:x.CostosSinIVA,Margen:x.VentasSinIVA-x.CostosSinIVA}));const totals=out.reduce((a,r)=>({Nombre:'TOTAL',Servicios:a.Servicios+r.Servicios,Pasajeros:a.Pasajeros+r.Pasajeros,VentasSinIVA:a.VentasSinIVA+r.VentasSinIVA,CostosSinIVA:a.CostosSinIVA+r.CostosSinIVA,Margen:a.Margen+r.Margen}),{Servicios:0,Pasajeros:0,VentasSinIVA:0,CostosSinIVA:0,Margen:0});toExcel(out,'analisis_tours_proveedores.xlsx',totals)}

function saveSimple(type,id=''){
 const n=$('simpleName').value.trim();
 if(!n)return alert('Ingrese el nombre.');
 if(type==='supplier'){
   const item=id?db.suppliers.find(x=>x.id===id):{id:uid()};
   Object.assign(item,{name:n,contact:$('simpleContact').value.trim(),phone:$('simplePhone').value.trim(),email:$('simpleExtra').value.trim()});
   if(!id)db.suppliers.push(item);
 }
 if(type==='client'){
   const item=id?db.clients.find(x=>x.id===id):{id:uid()};
   Object.assign(item,{name:n,type:$('simpleType').value,phone:$('simplePhone').value,currency:item.currency||'USD'});
   if(!id)db.clients.push(item);
 }
 if(type==='seller'){
   const item=id?db.sellers.find(x=>x.id===id):{id:uid()};
   Object.assign(item,{name:n,commissionRate:+$('simpleExtra').value||0});
   if(!id)db.sellers.push(item);
 }
 saveDB();closeModal();
}

async function loadTourRates(tourId){
 const d=await api('/api/tour-rates/'+encodeURIComponent(tourId));
 return d.rates||[];
}

function rateDate(value){
 if(!value)return '';
 const raw=String(value).slice(0,10);
 const m=raw.match(/^(\d{4})-(\d{2})-(\d{2})$/);
 return m?`${m[3]}/${m[2]}/${m[1]}`:raw;
}

function rateStatus(r){
 if(!r.active)
   return '<span class="badge pending">Inactiva</span>';

 const today=new Date();

 const iso=
   today.getFullYear()+'-'+
   String(today.getMonth()+1).padStart(2,'0')+'-'+
   String(today.getDate()).padStart(2,'0');

 if(iso<r.validFrom)
   return '<span class="badge pending">Próxima</span>';

 if(iso>r.validTo)
   return '<span class="badge pending">Vencida</span>';

 return '<span class="badge">Vigente</span>';
}

function tourRatesHtml(rates){

 if(!rates.length)
   return `
     <div class="tm-rate-empty">
       No hay tarifas configuradas para este tour.
     </div>
   `;

 return `
 <div class="tm-rates-table-wrap">

   <table class="tm-rates-table">

     <thead>
       <tr>
         <th>Desde</th>
         <th>Hasta</th>
         <th>Costo</th>
         <th>Precio venta</th>
         <th>Margen</th>
         <th>Estado</th>
         <th></th>
       </tr>
     </thead>

     <tbody>

       ${rates.map(r=>`

         <tr>

           <td>${rateDate(r.validFrom)}</td>

           <td>${rateDate(r.validTo)}</td>

           <td>${money(r.cost)}</td>

           <td>${money(r.salePrice)}</td>

           <td>
             ${money(
               Number(r.salePrice||0) -
               Number(r.cost||0)
             )}
           </td>

           <td>${rateStatus(r)}</td>

           <td class="tm-rate-actions">

             <button
               type="button"
               class="secondary"
               onclick="editTourRate('${r.id}')">
               Editar
             </button>

             <button
               type="button"
               class="secondary"
               onclick="toggleTourRate('${r.id}',${!r.active})">
               ${r.active?'Inactivar':'Activar'}
             </button>

           </td>

         </tr>

       `).join('')}

     </tbody>

   </table>

 </div>
 `;
}

async function saveTourRate(tourId,rateId=''){

 const from=$('tm-rate-from')?.value||'';
 const to=$('tm-rate-to')?.value||'';

 const cost=
   Number($('tm-rate-cost')?.value||0);

 const salePrice=
   Number($('tm-rate-sale')?.value||0);

 const active=
   $('tm-rate-active')?.value!=='false';

 const msg=$('tm-rate-message');

 if(!from||!to){

   if(msg)
     msg.textContent=
       'Debe indicar ambas fechas.';

   return;
 }

 if(to<from){

   if(msg)
     msg.textContent=
       'La fecha final no puede ser anterior a la inicial.';

   return;
 }

 try{

   const payload={
     tourId,
     validFrom:from,
     validTo:to,
     cost,
     salePrice,
     active
   };

   if(rateId){

     await api(
       '/api/tour-rates/'+
       encodeURIComponent(rateId),
       {
         method:'PUT',
         body:JSON.stringify(payload)
       }
     );

   }else{

     await api(
       '/api/tour-rates',
       {
         method:'POST',
         body:JSON.stringify(payload)
       }
     );

   }

   tourForm(tourId);

 }catch(e){

   if(msg)
     msg.textContent=e.message;
   else
     alert(e.message);

 }
}

async function editTourRate(rateId){

 try{

   const tourId=
     window.tmCurrentTourId;

   if(!tourId)return;

   const rates=
     await loadTourRates(tourId);

   const rate=
     rates.find(x=>x.id===rateId);

   if(!rate)
     return alert('No se encontró la tarifa.');

   tourRateForm(tourId,rate);

 }catch(e){

   alert(e.message);

 }
}

async function toggleTourRate(rateId,active){

 try{

   await api(
     '/api/tour-rates/'+
     encodeURIComponent(rateId)+
     '/status',
     {
       method:'PATCH',
       body:JSON.stringify({active})
     }
   );

   if(window.tmCurrentTourId)
     renderTourRates(
       window.tmCurrentTourId
     );

 }catch(e){

   alert(e.message);

 }
}

function tourForm(id=null){

 const t=id?db.tours.find(x=>x.id===id):null;

 if(id) window.tmCurrentTourId=id;
 else window.tmCurrentTourId=null;

 modal(
   t?'Editar tour':'Nuevo tour',

   `
   <div class="tm-tour-form">

     <div class="grid">

       <div class="field">
         <label>Tour *</label>
         <input id="tourName"
           value="${esc(t?.name||'')}">
       </div>

       <div class="field">
         <label>Precio hotel actual</label>
         <input id="tourHotel"
           type="number"
           step=".01"
           value="${t?.hotel||0}">
       </div>

       <div class="field">
         <label>Costo actual</label>
         <input id="tourCost"
           type="number"
           step=".01"
           value="${t?.cost||0}">
       </div>

     </div>

     ${
       t
       ?
       `
       <div class="tm-rates-panel">

         <div class="tm-rates-header">

           <div>
             <h3>Tarifas por vigencia</h3>

             <p>
               Configure costo y precio de venta según
               la fecha del servicio.
             </p>
           </div>

           <button
             type="button"
             class="primary"
             onclick="tourRateForm('${id}')">
             + Nueva tarifa
           </button>

         </div>

         <div id="tm-tour-rates">
           <div class="tm-rate-loading">
             Cargando tarifas...
           </div>
         </div>

       </div>
       `
       :
       `
       <div class="tm-new-tour-note">

         <strong>Tarifas por vigencia</strong>

         <p>
           Primero guarde el tour. Después podrá configurar
           sus tarifas para 2026, 2027 y períodos futuros.
         </p>

       </div>
       `
     }

     <div class="actions">

       <button
         type="button"
         class="secondary"
         onclick="closeModal()">
         Cancelar
       </button>

       <button
         type="button"
         class="primary"
         onclick="saveTour('${id||''}')">
         Guardar
       </button>

     </div>

   </div>
   `
 );

 if(t)
   renderTourRates(id);
}

function saveTour(id){

 const n=$('tourName').value.trim();

 if(!n)
   return alert('Ingrese el tour.');

 const d={
   name:n,
   hotel:+$('tourHotel').value||0,
   cost:+$('tourCost').value||0
 };

 if(id){

   const t=db.tours.find(x=>x.id===id);

   if(t)
     Object.assign(t,d);

 }else{

   db.tours.push({
     id:uid(),
     ...d
   });

 }

 saveDB();
 closeModal();
}

init();
</script>

<script>
(function(){
const catalog=[
['Clientes','clients',['view','create','edit','delete']],
['Proveedores','suppliers',['view','create','edit','delete']],
['Vendedores','sellers',['view','create','edit','delete']],
['Tours','tours',['view','create','edit','delete']],
['Órdenes de compra','purchase_orders',['view','create','edit','delete']],
['Ventas','sales',['view','create','edit','delete']],
['Pagos','payments',['view','create','edit','delete']],
['Reportes','reports',['service_dates.view','sellers.view','sales_analysis.view','best_sellers.view']],
['Usuarios','users',['view','create','edit','delete']],
['Configuración','settings',['view','edit']]
];
const labels={view:'Ver',create:'Crear',edit:'Editar',delete:'Eliminar',
'service_dates.view':'Tours por fecha','sellers.view':'Vendedores / comisiones',
'sales_analysis.view':'Análisis de ventas','best_sellers.view':'Más vendidos'};
const $=id=>document.getElementById(id);
async function api(url,opt){const r=await fetch(url,Object.assign({headers:{'Content-Type':'application/json'}},opt||{}));const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Error de servidor');return d}
function renderPermissions(selected=[]){
 const s=new Set(selected);
 $('tm-permissions-grid').innerHTML=catalog.map(([title,prefix,acts])=>{
  const report=prefix==='reports';
  if(report) return '<div class="tm-pgroup"><div class="tm-ptitle">'+title+'</div>'+
   acts.map(a=>{let p=prefix+'.'+a;return '<label class="tm-prow"><span>'+labels[a]+'</span><span></span><span><input type="checkbox" data-perm="'+p+'" '+(s.has(p)?'checked':'')+'></span><span></span><span></span></label>'}).join('')+'</div>';
  return '<div class="tm-pgroup"><div class="tm-ptitle">'+title+'</div>'+
   '<div class="tm-prow" style="font-weight:600"><span></span><span>Ver</span><span>Crear</span><span>Editar</span><span>Eliminar</span></div>'+
   acts.map(a=>'<label class="tm-prow"><span>'+title+'</span><span><input type="checkbox" data-perm="'+prefix+'.'+a+'" '+(s.has(prefix+'.'+a)?'checked':'')+'></span><span></span><span></span><span></span></label>').join('')+
   '</div>';
 }).join('');
 // For CRUD modules, one row per action would be confusing; replace with proper matrix.
 document.querySelectorAll('.tm-pgroup').forEach((g,i)=>{
  if(i===7) return;
  const [title,prefix,acts]=catalog[i];
  g.innerHTML='<div class="tm-ptitle">'+title+'</div><div class="tm-prow" style="font-weight:600"><span></span><span>Ver</span><span>Crear</span><span>Editar</span><span>Eliminar</span></div>'+
   '<div class="tm-prow"><span>Permisos</span>'+acts.map(a=>'<span><input type="checkbox" data-perm="'+prefix+'.'+a+'" '+(s.has(prefix+'.'+a)?'checked':'')+'></span>').join('')+'</div>';
 });
}
async function loadUsers(){
 const d=await api('/api/users');
 $('tm-users-list').innerHTML=d.users.map(u=>'<div class="tm-uitem" data-id="'+u.id+'"><strong>'+u.name+'</strong><small>'+u.email+'<br>'+(u.active?'Activo':'Inactivo')+'</small></div>').join('')||'<p>No hay usuarios.</p>';
 document.querySelectorAll('.tm-uitem').forEach(x=>x.onclick=()=>editUser(x.dataset.id));
}
async function editUser(id){
 const [uData,pData]=await Promise.all([api('/api/users'),api('/api/users/'+id+'/permissions')]);
 const u=uData.users.find(x=>x.id===id); if(!u)return;
 $('tm-user-id').value=u.id;$('tm-user-name').value=u.name;$('tm-user-email').value=u.email;
 $('tm-user-role').value=u.role;$('tm-user-active').value=String(u.active);$('tm-user-password').value='';
 renderPermissions(pData.permissions.filter(x=>x.allowed).map(x=>x.permission));
 $('tm-user-message').textContent='';
}
function newUser(){ $('tm-user-id').value='';$('tm-user-form').reset();$('tm-user-role').value='user';$('tm-user-active').value='true';renderPermissions([]);$('tm-user-message').textContent='';}
const tmNewUserBtn=$('tm-user-new');
if(tmNewUserBtn){
  tmNewUserBtn.disabled=false;
  tmNewUserBtn.removeAttribute('disabled');
  tmNewUserBtn.style.pointerEvents='auto';
  tmNewUserBtn.style.cursor='pointer';
  tmNewUserBtn.onclick=()=>newUser();
}
$('tm-user-cancel').onclick=()=>newUser();
$('tm-perm-all').onclick=()=>document.querySelectorAll('#tm-permissions-grid input').forEach(x=>x.checked=true);
$('tm-perm-none').onclick=()=>document.querySelectorAll('#tm-permissions-grid input').forEach(x=>x.checked=false);
$('tm-user-form').onsubmit=async e=>{
 e.preventDefault();try{
  const id=$('tm-user-id').value, body={name:$('tm-user-name').value,email:$('tm-user-email').value,role:$('tm-user-role').value,active:$('tm-user-active').value==='true'};
  if($('tm-user-password').value)body.password=$('tm-user-password').value;
  const u=id?(await api('/api/users/'+id,{method:'PATCH',body:JSON.stringify(body)})).user:(await api('/api/users',{method:'POST',body:JSON.stringify(body)})).user;
  const permissions=[...document.querySelectorAll('#tm-permissions-grid input:checked')].map(x=>x.dataset.perm);
  await api('/api/users/'+u.id+'/permissions',{method:'PUT',body:JSON.stringify({permissions})});
  $('tm-user-message').textContent='Usuario y permisos guardados correctamente.';await loadUsers();await editUser(u.id);
 }catch(err){$('tm-user-message').textContent=err.message}
};
window.TourManagerUsers={show:async()=>{$('tm-users-admin').style.display='block';await loadUsers();newUser()},hide:()=>{$('tm-users-admin').style.display='none'}};
})();
</script>

<script>
async function tmAuthInit(){
  const screen=document.getElementById('tm-auth-screen'), form=document.getElementById('tm-auth-form');
  async function req(url,opt){const r=await fetch(url,Object.assign({headers:{'Content-Type':'application/json'}},opt||{}));const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Error');return d}
  function show(setup){screen.style.display='flex';document.getElementById('tm-auth-title').textContent=setup?'Configuración inicial':'Tour Manager';document.getElementById('tm-auth-text').textContent=setup?'No hay usuarios. Crea el administrador inicial.':'Inicia sesión para continuar.';document.getElementById('tm-auth-name-wrap').style.display=setup?'block':'none';document.getElementById('tm-auth-name').required=setup;document.getElementById('tm-auth-submit').textContent=setup?'Crear administrador':'Entrar';}
  function hide(){screen.style.display='none'}
  try{
    const st=await req('/api/auth/status');
    if(st.authenticated){
      const p=await req('/api/auth/permissions'); TM_AUTH={user:st.user,permissions:p.permissions}; hide(); VIEWS=BASE_VIEWS.slice(); render(); return;
    }
    show(st.userCount===0);
    form.onsubmit=async e=>{e.preventDefault();document.getElementById('tm-auth-msg').textContent='';try{
      const setup=st.userCount===0; const body={email:document.getElementById('tm-auth-email').value,password:document.getElementById('tm-auth-password').value}; if(setup)body.name=document.getElementById('tm-auth-name').value;
      const d=await req(setup?'/api/auth/bootstrap':'/api/auth/login',{method:'POST',body:JSON.stringify(body)});
      const p=await req('/api/auth/permissions');TM_AUTH={user:d.user,permissions:p.permissions};hide();render();
    }catch(err){document.getElementById('tm-auth-msg').textContent=err.message;}};
  }catch(e){screen.style.display='flex';document.getElementById('tm-auth-msg').textContent='No fue posible conectar con el servidor.'}
}
async function tmLogout(){try{await fetch('/api/auth/logout',{method:'POST'});}finally{location.reload()}}
document.addEventListener('DOMContentLoaded',tmAuthInit);
</script>
